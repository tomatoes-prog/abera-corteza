title: Consola de privacidad de datos
connection-location: Ubicación de la conexión
description:
  first: La consola de privacidad permite consultar tus datos personales y solicitar su eliminación, corrección o exportación.
  second: Estas acciones están sujetas a validación por parte del responsable del tratamiento de datos de tu organización.
user-options:
  data-overview:
    title: Resumen de datos
    description: Revisa la información de tu perfil y los datos personales almacenados en las aplicaciones de Corteza.
    button-label: Ver mis datos
  privacy-requests:
    title: Solicitudes de privacidad
    description: Consulta, administra o exporta tus solicitudes de eliminación, exportación o corrección de datos.
    button-label: Ver mis solicitudes
  export:
    title: Exportación de datos
    description: Crea una solicitud seleccionando el tipo de datos, el intervalo de fechas y el formato del archivo.
    button-label: Solicitar exportación
  delete:
    title: Eliminación de datos
    description: Solicita que los datos personales seleccionados sean eliminados del sistema.
    button-label: Solicitar eliminación
dc-options:
  privacy-requests:
    title: Solicitudes de privacidad
    description: Consulta, administra o exporta las solicitudes de eliminación, exportación o corrección recibidas.
    button-label: Ver solicitudes recibidas
  sensitive-data:
    title: Datos sensibles
    description: Consulta los módulos que contienen campos identificados como datos sensibles.
    button-label: Ver datos sensibles
