id: automotriz-co
name: CRM Automotriz Colombia
version: 2.0.0
minimumCortezaVersion: 2024.9.9
defaultLocale: es
license: Apache-2.0
description: Gestión productiva de ventas, inventario, pruebas de manejo, actividades comerciales, taller y posventa.
resources:
  namespace: automotriz-co
  roles:
    - asesor-automotriz
    - jefe-comercial-automotriz
    - coordinador-taller
    - automatizacion-automotriz
  users:
    - automatizacion-automotriz
  modules:
    - prospectos
    - vehiculos
    - pruebas-manejo
    - oportunidades
    - ordenes-servicio
    - actividades-comerciales
    - tareas-servicio
  pages:
    - inicio
    - prospectos
    - vehiculos
    - pruebas-manejo
    - oportunidades
    - ordenes-servicio
    - reportes
  charts:
    - funnel-ventas
    - oportunidades-por-etapa
    - pruebas-por-resultado
    - inventario-por-estado
    - servicio-por-estado
  workflows:
    - asignar-prospecto-automotriz
    - validar-disponibilidad-prueba
    - crear-oportunidad-desde-prueba
    - cerrar-venta-automotriz
    - avisar-asignacion-automotriz-co
    - ejemplo-correo-responsable-automotriz-co
    - ejemplo-slack-hito-automotriz-co
  reports:
    - automotriz-co-ejecutivo
    - automotriz-co-operativo
  scripts:
    - scripts/seed-demo.ps1
