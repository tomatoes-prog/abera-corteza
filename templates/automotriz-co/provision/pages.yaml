            meta:
              title: Diseño principal · Detalle de la prueba
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Pruebas de manejo
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 8
          - 18
        - blockID: 2
          xywh:
          - 8
          - 0
          - 4
          - 18
