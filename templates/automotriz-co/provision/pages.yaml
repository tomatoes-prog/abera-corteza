namespace: automotriz-co
pages:
  inicio:
    title: Inicio
    visible: true
    blocks:
    - title: Funnel de ventas
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: funnel-ventas
      blockID: 1
    - title: Inventario
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: inventario-por-estado
      blockID: 2
    - title: Posventa
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: servicio-por-estado
      blockID: 3
    - title: Prospectos sin asignar
      kind: RecordList
      xywh:
      - 0
      - 30
      - 24
      - 10
      options:
        module: prospectos
        fields:
        - name: nombres
        - name: telefono
        - name: presupuestoMaximo
        - name: estado
        - name: createdAt
        prefilter: asesor IS NULL
        presort: createdAt ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 4
    - title: Clientes por recuperar
      kind: RecordList
      xywh:
      - 24
      - 30
      - 24
      - 10
      options:
        module: vehiculos
        fields:
        - name: codigo
        - name: clienteFinal
        - name: proximoMantenimiento
        - name: estado
        prefilter: estado = 'Vendido' AND proximoMantenimiento IS NOT NULL
        presort: proximoMantenimiento ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 5
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Inicio
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 24
          - 10
        - blockID: 5
          xywh:
          - 24
          - 30
          - 24
          - 10
  prospectos:
    title: Prospectos
    visible: true
    blocks:
    - title: Prospectos comerciales
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: prospectos
        fields:
        - name: nombres
        - name: apellidos
        - name: telefono
        - name: ciudad
        - name: presupuestoMaximo
        - name: estado
        - name: asesor
        - name: proximoContacto
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      prospecto-registro:
        title: Detalle del prospecto
        module: prospectos
        visible: false
        blocks:
        - title: Información y necesidad
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: nombres
            - name: apellidos
            - name: telefono
            - name: correo
            - name: autorizaTratamientoDatos
            - name: ciudad
            - name: presupuestoMinimo
            - name: presupuestoMaximo
            - name: plazoCompra
            - name: vehiculoActual
            - name: requiereFinanciacion
            - name: vehiculosInteres
            - name: origen
            - name: estado
            - name: asesor
            - name: fechaAsignacion
            - name: proximoContacto
            - name: notas
          blockID: 1
        - title: Pruebas de manejo
          kind: RecordList
          xywh:
          - 0
          - 14
          - 6
          - 9
          options:
            module: pruebas-manejo
            fields:
            - name: asunto
            - name: vehiculo
            - name: inicio
            - name: estado
            - name: resultado
            prefilter: prospecto = ${recordID}
            presort: inicio DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 2
        - title: Oportunidades
          kind: RecordList
          xywh:
          - 6
          - 14
          - 6
          - 9
          options:
            module: oportunidades
            fields:
            - name: vehiculo
            - name: etapa
            - name: valorOfertado
            - name: probabilidad
            - name: fechaEstimadaCierre
            prefilter: prospecto = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del prospecto
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
            - blockID: 2
              xywh:
              - 0
              - 14
              - 6
              - 9
            - blockID: 3
              xywh:
              - 6
              - 14
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Prospectos
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  vehiculos:
