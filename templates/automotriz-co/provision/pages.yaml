namespace: automotriz-co
pages:
  inicio:
    title: Inicio
    visible: true
    blocks:
      - title: Funnel de ventas
        kind: Chart
        xywh:
          - 0
          - 18
          - 24
          - 30
        options:
          chart: funnel-ventas
        blockID: 1
        description: Gráfico que resume funnel de ventas a partir de datos actuales.
      - title: Inventario
        kind: Chart
        xywh:
          - 24
          - 18
          - 24
          - 30
        options:
          chart: inventario-por-estado
        blockID: 2
        description: Gráfico que resume inventario a partir de datos actuales.
      - title: Posventa
        kind: Chart
        xywh:
          - 0
          - 48
          - 48
          - 30
        options:
          chart: servicio-por-estado
        blockID: 3
        description: Gráfico que resume posventa a partir de datos actuales.
      - title: Prospectos sin asignar
        kind: RecordList
        xywh:
          - 0
          - 78
          - 24
          - 48
        options:
          module: prospectos
          fields:
            - name: nombres
            - name: telefono
            - name: presupuestoMaximo
            - name: estado
            - name: createdAt
          prefilter: asesor IS NULL
          presort: createdAt ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 4
        description: Listado operativo de prospectos sin asignar con búsqueda, filtros, conteo y exportación.
      - title: Clientes por recuperar
        kind: RecordList
        xywh:
          - 24
          - 78
          - 24
          - 48
        options:
          module: vehiculos
          fields:
            - name: codigo
            - name: clienteFinal
            - name: proximoMantenimiento
            - name: estado
          prefilter: estado = 'Vendido' AND proximoMantenimiento IS NOT NULL
          presort: proximoMantenimiento ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 5
        description: Listado operativo de clientes por recuperar con búsqueda, filtros, conteo y exportación.
      - blockID: 6
        description: Prospectos que todavía no tienen un asesor responsable.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: asesor IS NULL
              label: Prospectos sin asignar
              metricField: count
              module: prospectos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Prospectos sin asignar
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 7
        description: Pruebas de manejo pendientes o confirmadas.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Pendiente' OR estado = 'Confirmada'
              label: Pruebas próximas
              metricField: count
              module: pruebas-manejo
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Pruebas próximas
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 8
        description: Valor de las oportunidades comerciales abiertas en COP.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: etapa != 'Vendido' AND etapa != 'Perdido'
              label: Pipeline
              metricField: valorOfertado
              module: oportunidades
              numberFormat: 0,0
              operation: sum
              prefix: '$ '
              suffix: ""
          showRefresh: true
        title: Pipeline
        xywh:
          - 24
          - 0
          - 12
          - 18
      - blockID: 9
        description: Vehículos del inventario disponibles para venta.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Disponible'
              label: Vehículos disponibles
              metricField: count
              module: vehiculos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Vehículos disponibles
        xywh:
          - 36
          - 0
          - 12
          - 18
