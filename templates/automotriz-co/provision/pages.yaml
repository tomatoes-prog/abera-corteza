          blockID: 1
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del vehículo
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Inventario
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  pruebas-manejo:
    title: Pruebas de manejo
    visible: true
    blocks:
    - title: Agenda de pruebas
      kind: Calendar
      xywh:
      - 0
      - 0
      - 8
      - 18
      options:
        defaultView: dayGridMonth
        locale: es
        feeds:
