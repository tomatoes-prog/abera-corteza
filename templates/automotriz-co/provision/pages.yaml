          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: asunto
            - name: prospecto
            - name: vehiculo
            - name: asesor
            - name: inicio
            - name: fin
            - name: sede
            - name: estado
            - name: resultado
            - name: siguienteAccion
            - name: observaciones
