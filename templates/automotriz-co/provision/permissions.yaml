allow:
  asesor-automotriz: &operacion-automotriz
    corteza::compose:namespace/automotriz-co:
      - read
      - pages.search
      - modules.search
      - charts.search
    corteza::compose:module/automotriz-co/*:
      - read
      - record.create
      - records.search
    corteza::compose:module-field/automotriz-co/*/*:
      - record.value.read
      - record.value.update
    corteza::compose:record/automotriz-co/*/*:
      - read
      - update
      - revisions.search
    corteza::compose:page/automotriz-co/*:
      - read
    corteza::compose:chart/automotriz-co/*:
      - read

  coordinador-taller: *operacion-automotriz

  jefe-comercial-automotriz:
    corteza::compose:namespace/automotriz-co:
      - read
      - pages.search
      - modules.search
      - charts.search
    corteza::compose:module/automotriz-co/*:
      - read
      - record.create
      - records.search
    corteza::compose:module-field/automotriz-co/*/*:
      - record.value.read
      - record.value.update
    corteza::compose:record/automotriz-co/*/*:
      - read
      - update
      - delete
      - revisions.search
    corteza::compose:page/automotriz-co/*:
      - read
    corteza::compose:chart/automotriz-co/*:
      - read

  automatizacion-automotriz:
    corteza::system/: [users.search, roles.search]
    corteza::system:user/*: [read]
    corteza::system:role/*: [read]
    corteza::compose:namespace/automotriz-co: [read, modules.search]
    corteza::compose:module/automotriz-co/*: [read, record.create, records.search]
    corteza::compose:module-field/automotriz-co/*/*: [record.value.read, record.value.update]
    corteza::compose:record/automotriz-co/*/*: [read, update]
