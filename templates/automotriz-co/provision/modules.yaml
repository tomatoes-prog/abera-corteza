      orden:
        label: Orden de servicio
        kind: Record
        required: true
        options: {module: ordenes-servicio, labelField: codigo, description: {view: Relación con ordenes servicio. Permite consultar un registro vinculado en este registro de Tareas de servicio., edit: Seleccione orden de servicio dentro del módulo ordenes servicio. La relación admite un registro; no escriba identificadores manualmente. Es obligatorio para guardar un registro completo.}}
      secuencia: {label: Secuencia, kind: Number, options: {format: "0", precision: 0, description: {view: Valor numérico de secuencia para este registro de Tareas de servicio., edit: Ingrese secuencia como número. Es opcional; complételo cuando la información esté disponible.}}}
      tarea: {label: Tarea, kind: String, required: true, options: {description: {view: El campo «Tarea» conserva información operativa del registro en Tareas de servicio., edit: 'Ingrese tarea con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
      obligatoria: {label: Obligatoria, kind: Bool, options: {falseLabel: "No", trueLabel: "Sí", description: {view: Indica si obligatoria aplica a este registro de Tareas de servicio., edit: Marque Sí únicamente cuando obligatoria esté confirmado; en caso contrario seleccione No. Es opcional; complételo cuando la información esté disponible.}}}
      tecnico: {label: Técnico responsable, kind: User, options: {description: {view: Usuario de Corteza responsable de técnico responsable en este registro de Tareas de servicio., edit: Seleccione un usuario activo con el rol operativo correspondiente. Es opcional; complételo cuando la información esté disponible.}}}
      estado:
        label: Estado
        kind: Select
        required: true
        default: Pendiente
        options:
          options:
            - {text: Pendiente, value: Pendiente}
            - {text: En ejecución, value: En ejecución}
            - {text: Completada, value: Completada}
            - {text: No aplica, value: No aplica}
          selectType: default
