        options: {format: "0", precision: 0, prefix: "$ ", description: {view: Presupuesto mínimo expresado en pesos colombianos (COP) para este registro de Prospectos., edit: 'Ingrese presupuesto mínimo en COP, sin símbolos ni separadores manuales. Es opcional; complételo cuando la información esté disponible.'}}
      presupuestoMaximo:
        label: Presupuesto máximo
        kind: Number
        options: {format: "0", precision: 0, prefix: "$ ", description: {view: Presupuesto máximo expresado en pesos colombianos (COP) para este registro de Prospectos., edit: 'Ingrese presupuesto máximo en COP, sin símbolos ni separadores manuales. Es opcional; complételo cuando la información esté disponible.'}}
