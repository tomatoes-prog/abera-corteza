            - {text: Alta, value: Alta}
            - {text: Urgente, value: Urgente}
          selectType: default
          description:
            view: Clasificación de prioridad comercial para este registro de Prospectos.
            edit: 'Seleccione un valor para prioridad comercial entre: Baja, Media, Alta, Urgente. Es opcional; complételo cuando la información esté disponible.'
