            edit: 'Seleccione un valor para estado entre: Pendiente, En ejecución, Completada, No aplica. Es obligatorio para guardar un registro completo.'
      resultado:
        label: Resultado
        kind: String
        options: {multiLine: true, description: {view: El campo «Resultado» conserva información operativa del registro en Tareas de servicio., edit: 'Ingrese resultado con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}
      evidencia:
        label: Evidencia
        kind: File
        multi: true
        options: {allowDocuments: true, allowImages: true, maxSize: 0, mode: list, description: {view: Archivos asociados con evidencia en este registro de Tareas de servicio., edit: Adjunte uno o varios archivos pertinentes para evidencia. No cargue credenciales ni información innecesaria. Es opcional; complételo cuando la información esté disponible.}}
      inicioReal: {label: Inicio real, kind: DateTime, options: {description: {view: 'Fecha y hora de inicio real para este registro de Tareas de servicio, interpretada en America/Bogota.', edit: Indique inicio real usando la zona horaria America/Bogota. Es opcional; complételo cuando la información esté disponible.}}}
      finReal: {label: Fin real, kind: DateTime, options: {description: {view: 'Fecha y hora de fin real para este registro de Tareas de servicio, interpretada en America/Bogota.', edit: Indique fin real usando la zona horaria America/Bogota. Es opcional; complételo cuando la información esté disponible.}}}
    meta:
      description: Checklist operativo de una orden de servicio. Cada tarea identifica responsable, obligatoriedad, estado, resultado y evidencia antes del cierre de la orden.
  prospectos:
    name: Prospectos
    fields:
      nombres:
        label: Nombres
        kind: String
        required: true
        options:
          description:
            view: El campo «Nombres» conserva información operativa del registro en Prospectos.
            edit: Ingrese nombres con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      apellidos:
        label: Apellidos
        kind: String
        options:
          description:
            view: El campo «Apellidos» conserva información operativa del registro en Prospectos.
            edit: Ingrese apellidos con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      telefono:
        label: Teléfono
        kind: String
        required: true
        options:
          description:
            view: El campo «Teléfono» conserva información operativa del registro en Prospectos.
            edit: Ingrese el número de contacto en formato internacional, preferiblemente +57 seguido de diez dígitos para Colombia. Es obligatorio para guardar un registro completo.
      correo:
        label: Correo electrónico
        kind: String
        options:
          description:
            view: El campo «Correo electrónico» conserva información operativa del registro en Prospectos.
            edit: Ingrese una dirección de correo válida, por ejemplo nombre@empresa.com. Es opcional; complételo cuando la información esté disponible.
      autorizaTratamientoDatos:
        label: Autoriza el tratamiento de datos
        kind: Bool
        options: {falseLabel: "No", trueLabel: "Sí", description: {view: Evidencia de que la persona autorizó el tratamiento o contacto conforme a la finalidad informada., edit: 'Marque Sí únicamente después de obtener una autorización previa, informada y verificable; registre también su fecha y origen cuando estén disponibles.'}}
      fechaAutorizacion: {label: Fecha de autorización, kind: DateTime, options: {description: {view: Evidencia de que la persona autorizó el tratamiento o contacto conforme a la finalidad informada., edit: 'Registre la fecha y hora en que se obtuvo la autorización verificable, usando America/Bogota. Es opcional; complételo cuando la información esté disponible.'}}}
      origenAutorizacion:
        label: Origen de la autorización
        kind: Select
        options:
          options:
            - {text: Formulario web, value: Formulario web}
            - {text: Sala de ventas, value: Sala de ventas}
            - {text: WhatsApp, value: WhatsApp}
            - {text: Telefónica, value: Telefónica}
          selectType: default
          description:
            view: Evidencia de que la persona autorizó el tratamiento o contacto conforme a la finalidad informada.
            edit: Marque Sí únicamente después de obtener una autorización previa, informada y verificable; registre también su fecha y origen cuando estén disponibles.
      ciudad:
        label: Ciudad
        kind: String
        options:
          description:
            view: El campo «Ciudad» conserva información operativa del registro en Prospectos.
            edit: Ingrese ciudad con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
