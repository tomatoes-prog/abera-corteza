        kind: Bool
        options: {falseLabel: "No", trueLabel: "Sí", description: {view: Indica si requiere financiación aplica a este registro de Prospectos., edit: Marque Sí únicamente cuando requiere financiación esté confirmado; en caso contrario seleccione No. Es opcional; complételo cuando la información esté disponible.}}
      vehiculosInteres:
