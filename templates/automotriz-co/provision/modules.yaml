namespace: automotriz-co
modules:
  vehiculos:
    name: Vehículos
    fields:
      codigo:
        label: Código de inventario
        kind: String
        required: true
        options:
          description:
            view: El campo «Código de inventario» conserva información operativa del registro en Vehículos.
            edit: Ingrese código de inventario con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      vin:
        label: VIN
        kind: String
        options:
          description:
            view: El campo «VIN» conserva información operativa del registro en Vehículos.
            edit: Ingrese vin con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      placa:
        label: Placa
        kind: String
        options:
          description:
            view: El campo «Placa» conserva información operativa del registro en Vehículos.
            edit: Ingrese placa con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      marca:
        label: Marca
        kind: String
        required: true
        options:
          description:
            view: El campo «Marca» conserva información operativa del registro en Vehículos.
            edit: Ingrese marca con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      modelo:
        label: Modelo
        kind: String
        required: true
        options:
          description:
            view: El campo «Modelo» conserva información operativa del registro en Vehículos.
            edit: Ingrese modelo con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      version:
        label: Versión
        kind: String
        options:
          description:
            view: El campo «Versión» conserva información operativa del registro en Vehículos.
            edit: Ingrese versión con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      anio:
        label: Año
        kind: Number
        required: true
        options: {format: "0", precision: 0, description: {view: Valor numérico de año para este registro de Vehículos., edit: Ingrese año como número. Es obligatorio para guardar un registro completo.}}
      condicion:
        label: Condición
        kind: Select
        required: true
        options:
          options:
            - {text: Nuevo, value: Nuevo}
            - {text: Usado, value: Usado}
          selectType: default
          description:
            view: Clasificación de condición para este registro de Vehículos.
            edit: 'Seleccione un valor para condición entre: Nuevo, Usado. Es obligatorio para guardar un registro completo.'
      kilometraje:
        label: Kilometraje
        kind: Number
        options: {format: "0", precision: 0, suffix: " km", description: {view: Valor numérico de kilometraje para este registro de Vehículos., edit: Ingrese kilometraje como número. Es opcional; complételo cuando la información esté disponible.}}
      color:
        label: Color
        kind: String
        options:
          description:
            view: El campo «Color» conserva información operativa del registro en Vehículos.
            edit: Ingrese color con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      precio:
        label: Precio
        kind: Number
        required: true
        options: {format: "0", precision: 0, prefix: "$ ", description: {view: Precio expresado en pesos colombianos (COP) para este registro de Vehículos., edit: 'Ingrese precio en COP, sin símbolos ni separadores manuales. Es obligatorio para guardar un registro completo.'}}
      sede:
        label: Sede
        kind: String
        options:
          description:
            view: El campo «Sede» conserva información operativa del registro en Vehículos.
            edit: Ingrese sede con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      fechaIngreso:
        label: Fecha de ingreso
        kind: DateTime
        options: {onlyDate: true, description: {view: Fecha de fecha de ingreso para este registro de Vehículos., edit: Indique fecha de ingreso en formato de fecha; no agregue una hora. Es opcional; complételo cuando la información esté disponible.}}
      estado:
        label: Estado
        kind: Select
        required: true
        default: Disponible
        options:
          options:
            - {text: Disponible, value: Disponible}
            - {text: Reservado, value: Reservado}
            - {text: Vendido, value: Vendido}
            - {text: En demostración, value: En demostración}
            - {text: En taller, value: En taller}
            - {text: Inactivo, value: Inactivo}
          selectType: default
          description:
            view: Clasificación de estado para este registro de Vehículos.
            edit: 'Seleccione un valor para estado entre: Disponible, Reservado, Vendido, En demostración, En taller, Inactivo. Es obligatorio para guardar un registro completo.'
      clienteFinal:
        label: Cliente final
        kind: Record
        options: {module: prospectos, labelField: nombres, description: {view: Relación con prospectos. Permite consultar un registro vinculado en este registro de Vehículos., edit: Seleccione cliente final dentro del módulo prospectos. La relación admite un registro; no escriba identificadores manualmente. Es opcional; complételo cuando la información esté disponible.}}
      proximoMantenimiento:
        label: Próximo mantenimiento
        kind: DateTime
        options: {onlyDate: true, description: {view: Fecha de próximo mantenimiento para este registro de Vehículos., edit: Indique próximo mantenimiento en formato de fecha; no agregue una hora. Es opcional; complételo cuando la información esté disponible.}}
      fotografias:
        label: Fotografías
        kind: File
        multi: true
        options: {allowDocuments: false, allowImages: true, maxSize: 0, mode: list, description: {view: Archivos asociados con fotografías en este registro de Vehículos., edit: Adjunte uno o varios archivos pertinentes para fotografías. No cargue credenciales ni información innecesaria. Es opcional; complételo cuando la información esté disponible.}}
      externalID:
        label: Identificador externo
        kind: String
        options:
          description:
            view: El campo «Identificador externo» conserva información operativa del registro en Vehículos.
            edit: No editar manualmente salvo durante una integración controlada. Debe contener el identificador estable del registro en el sistema externo.
      proveedorExterno:
        label: Proveedor externo
        kind: String
        options:
          description:
            view: El campo «Proveedor externo» conserva información operativa del registro en Vehículos.
            edit: Ingrese proveedor externo con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      estadoIntegracion:
        label: Estado de integración
        kind: Select
        default: Local
        options:
          options:
            - {text: Local, value: Local}
            - {text: Pendiente, value: Pendiente}
            - {text: Sincronizado, value: Sincronizado}
            - {text: Error, value: Error}
          selectType: default
          description:
            view: Clasificación de estado de integración para este registro de Vehículos.
            edit: No editar manualmente. Este valor es administrado por workflows o integraciones de la plantilla.
      ultimoErrorIntegracion:
        label: Último error de integración
        kind: String
        options: {multiLine: true, description: {view: El campo «Último error de integración» conserva información operativa del registro en Vehículos., edit: No editar manualmente. Este valor es administrado por workflows o integraciones de la plantilla.}}
    meta:
      description: Inventario de vehículos nuevos o usados. Reúne identificación, características, precio, sede, disponibilidad, cliente final y trazabilidad de pruebas, oportunidades y posventa.
  actividades-comerciales:
    name: Actividades comerciales
    fields:
      asunto: {label: Asunto, kind: String, required: true, options: {description: {view: El campo «Asunto» conserva información operativa del registro en Actividades comerciales., edit: 'Ingrese asunto con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
      prospecto:
        label: Prospecto
        kind: Record
        required: true
        options: {module: prospectos, labelField: nombres, description: {view: Relación con prospectos. Permite consultar un registro vinculado en este registro de Actividades comerciales., edit: Seleccione prospecto dentro del módulo prospectos. La relación admite un registro; no escriba identificadores manualmente. Es obligatorio para guardar un registro completo.}}
      vehiculo:
        label: Vehículo
        kind: Record
        options: {module: vehiculos, labelField: codigo, description: {view: Relación con vehiculos. Permite consultar un registro vinculado en este registro de Actividades comerciales., edit: Seleccione vehículo dentro del módulo vehiculos. La relación admite un registro; no escriba identificadores manualmente. Es opcional; complételo cuando la información esté disponible.}}
      oportunidad:
        label: Oportunidad
        kind: Record
        options: {module: oportunidades, labelField: prospecto, description: {view: Relación con oportunidades. Permite consultar un registro vinculado en este registro de Actividades comerciales., edit: Seleccione oportunidad dentro del módulo oportunidades. La relación admite un registro; no escriba identificadores manualmente. Es opcional; complételo cuando la información esté disponible.}}
      asesor: {label: Asesor, kind: User, required: true, options: {description: {view: Usuario de Corteza responsable de asesor en este registro de Actividades comerciales., edit: Seleccione un usuario activo con el rol operativo correspondiente. Es obligatorio para guardar un registro completo.}}}
      tipo:
        label: Tipo
        kind: Select
        required: true
        options:
          options:
            - {text: Llamada, value: Llamada}
            - {text: WhatsApp, value: WhatsApp}
            - {text: Correo, value: Correo}
            - {text: Reunión, value: Reunión}
            - {text: Seguimiento, value: Seguimiento}
          selectType: default
          description:
            view: Clasificación de tipo para este registro de Actividades comerciales.
            edit: 'Seleccione un valor para tipo entre: Llamada, WhatsApp, Correo, Reunión, Seguimiento. Es obligatorio para guardar un registro completo.'
      estado:
        label: Estado
        kind: Select
        required: true
        default: Pendiente
        options:
          options:
            - {text: Pendiente, value: Pendiente}
            - {text: Completada, value: Completada}
            - {text: Cancelada, value: Cancelada}
          selectType: default
          description:
            view: Clasificación de estado para este registro de Actividades comerciales.
            edit: 'Seleccione un valor para estado entre: Pendiente, Completada, Cancelada. Es obligatorio para guardar un registro completo.'
      fecha: {label: Fecha, kind: DateTime, required: true, options: {description: {view: 'Fecha y hora de fecha para este registro de Actividades comerciales, interpretada en America/Bogota.', edit: Indique fecha usando la zona horaria America/Bogota. Es obligatorio para guardar un registro completo.}}}
      resultado: {label: Resultado, kind: String, options: {description: {view: El campo «Resultado» conserva información operativa del registro en Actividades comerciales., edit: 'Ingrese resultado con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      proximaAccion: {label: Próxima acción, kind: DateTime, options: {description: {view: 'Fecha y hora de próxima acción para este registro de Actividades comerciales, interpretada en America/Bogota.', edit: Indique próxima acción usando la zona horaria America/Bogota. Es opcional; complételo cuando la información esté disponible.}}}
      observaciones:
        label: Observaciones
        kind: String
        options: {multiLine: true, description: {view: El campo «Observaciones» conserva información operativa del registro en Actividades comerciales., edit: 'Ingrese observaciones con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}
    meta:
      description: Seguimientos comerciales relacionados con un prospecto y, opcionalmente, un vehículo u oportunidad. Conserva responsable, fecha, resultado y próxima acción.
  tareas-servicio:
    name: Tareas de servicio
