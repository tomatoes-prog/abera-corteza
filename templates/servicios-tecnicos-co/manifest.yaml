id: servicios-tecnicos-co
name: CRM de Servicios Técnicos Colombia
version: 2.0.0
minimumCortezaVersion: 2024.9.9
defaultLocale: es
license: Apache-2.0
description: Operación de servicio en campo con activos, SLA, cotizaciones detalladas, mapa, checklist y evidencias.
resources:
  namespace: servicios-tecnicos-co
  roles: [coordinador-servicio, tecnico-servicio, gerente-servicio, automatizacion-servicios]
  users: [automatizacion-servicios]
  modules: [clientes-prospectos, activos, solicitudes, cotizaciones, ordenes-trabajo, items-cotizacion, tareas-orden]
  pages: [inicio, clientes-prospectos, activos, solicitudes, cotizaciones, ordenes-trabajo, reportes]
  charts:
    - funnel-servicios
    - solicitudes-por-prioridad
    - ordenes-por-estado
    - ordenes-por-tecnico
    - valor-por-servicio
  workflows:
    - preparar-solicitud-servicio
    - crear-orden-desde-cotizacion
    - asignar-tecnico-menor-carga
    - validar-agenda-tecnico
    - completar-orden-servicio
    - avisar-asignacion-servicios-tecnicos-co
    - ejemplo-correo-responsable-servicios-tecnicos-co
    - ejemplo-slack-hito-servicios-tecnicos-co
  reports: [servicios-tecnicos-co-ejecutivo, servicios-tecnicos-co-operativo]
  scripts: [scripts/seed-demo.ps1]
