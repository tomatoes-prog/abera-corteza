        label: Ubicación principal en el mapa
        kind: Geometry
        options:
          center: [4.711, -74.0721]
          zoom: 11
          description:
            view: Ubicación geográfica de Clientes y prospectos, utilizada por los mapas y la planeación operativa.
            edit: Busque o marque en el mapa la ubicación correspondiente a ubicación principal en el mapa. Verifique el punto antes de guardar. Es opcional; complételo cuando la información esté disponible.
      latitud:
        label: Latitud
        kind: Number
        options: {format: "0.000000", precision: 6, description: {view: Valor numérico de latitud para este registro de Clientes y prospectos., edit: Ingrese latitud como número. Es opcional; complételo cuando la información esté disponible.}}
      longitud:
        label: Longitud
        kind: Number
        options: {format: "0.000000", precision: 6, description: {view: Valor numérico de longitud para este registro de Clientes y prospectos., edit: Ingrese longitud como número. Es opcional; complételo cuando la información esté disponible.}}
      segmento:
        label: Segmento
        kind: Select
        options:
          options:
            - {text: Hogar, value: Hogar}
            - {text: Pyme, value: Pyme}
            - {text: Corporativo, value: Corporativo}
          selectType: default
          description:
            view: Clasificación de segmento para este registro de Clientes y prospectos.
            edit: 'Seleccione un valor para segmento entre: Hogar, Pyme, Corporativo. Es opcional; complételo cuando la información esté disponible.'
      estadoComercial:
        label: Estado comercial
        kind: Select
        default: Nuevo
        options:
          options:
            - {text: Nuevo, value: Nuevo}
            - {text: Diagnóstico, value: Diagnóstico}
            - {text: Cotización, value: Cotización}
            - {text: Cliente, value: Cliente}
            - {text: Perdido, value: Perdido}
          selectType: default
          description:
            view: Clasificación de estado comercial para este registro de Clientes y prospectos.
            edit: 'Seleccione un valor para estado comercial entre: Nuevo, Diagnóstico, Cotización, Cliente, Perdido. Es opcional; complételo cuando la información esté disponible.'
      responsable: {label: Responsable comercial, kind: User, options: {description: {view: Usuario de Corteza responsable de responsable comercial en este registro de Clientes y prospectos., edit: Seleccione un usuario activo con el rol operativo correspondiente. Es opcional; complételo cuando la información esté disponible.}}}
      proximoContacto: {label: Próximo contacto, kind: DateTime, options: {description: {view: 'Fecha y hora de próximo contacto para este registro de Clientes y prospectos, interpretada en America/Bogota.', edit: Indique próximo contacto usando la zona horaria America/Bogota. Es opcional; complételo cuando la información esté disponible.}}}
      notas:
        label: Notas
        kind: String
        options: {multiLine: true, description: {view: El campo «Notas» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese notas con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}
      externalID: {label: Identificador externo, kind: String, options: {description: {view: El campo «Identificador externo» conserva información operativa del registro en Clientes y prospectos., edit: No editar manualmente salvo durante una integración controlada. Debe contener el identificador estable del registro en el sistema externo.}}}
      proveedorExterno: {label: Proveedor externo, kind: String, options: {description: {view: El campo «Proveedor externo» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese proveedor externo con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
    meta:
      description: Personas o empresas que solicitan, cotizan o reciben servicios. Es el punto de entrada para activos, solicitudes, cotizaciones y órdenes de trabajo.
  activos:
    name: Activos
    fields:
      codigo: {label: Código, kind: String, required: true, options: {description: {view: El campo «Código» conserva información operativa del registro en Activos., edit: 'Ingrese código con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
