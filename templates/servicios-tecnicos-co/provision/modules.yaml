        kind: DateTime
        options: {onlyDate: true, description: {view: Fecha de última intervención para este registro de Activos., edit: Indique última intervención en formato de fecha; no agregue una hora. Es opcional; complételo cuando la información esté disponible.}}
      ubicacion: {label: Ubicación, kind: String, options: {description: {view: El campo «Ubicación» conserva información operativa del registro en Activos., edit: 'Ingrese ubicación con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
