namespace: servicios-tecnicos-co
modules:
  clientes-prospectos:
    name: Clientes y prospectos
    fields:
      tipo:
        label: Tipo
        kind: Select
        required: true
        default: Prospecto
        options:
          options:
            - {text: Prospecto, value: Prospecto}
            - {text: Cliente, value: Cliente}
          selectType: default
          description:
            view: Clasificación de tipo para este registro de Clientes y prospectos.
            edit: 'Seleccione un valor para tipo entre: Prospecto, Cliente. Es obligatorio para guardar un registro completo.'
      tipoPersona:
        label: Tipo de persona
        kind: Select
        options:
          options:
            - {text: Persona, value: Persona}
            - {text: Empresa, value: Empresa}
          selectType: default
          description:
            view: Clasificación de tipo de persona para este registro de Clientes y prospectos.
            edit: 'Seleccione un valor para tipo de persona entre: Persona, Empresa. Es opcional; complételo cuando la información esté disponible.'
      nombre: {label: Nombre o razón social, kind: String, required: true, options: {description: {view: El campo «Nombre o razón social» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese nombre o razón social con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
      identificacion: {label: Identificación o NIT, kind: String, options: {description: {view: El campo «Identificación o NIT» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese identificación o nit con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      contacto: {label: Persona de contacto, kind: String, options: {description: {view: El campo «Persona de contacto» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese persona de contacto con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      telefono: {label: Teléfono, kind: String, required: true, options: {description: {view: El campo «Teléfono» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese el número de contacto en formato internacional, preferiblemente +57 seguido de diez dígitos para Colombia. Es obligatorio para guardar un registro completo.'}}}
      correo: {label: Correo electrónico, kind: String, options: {description: {view: El campo «Correo electrónico» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese una dirección de correo válida, por ejemplo nombre@empresa.com. Es opcional; complételo cuando la información esté disponible.'}}}
      autorizaTratamientoDatos:
        label: Autoriza el tratamiento de datos
        kind: Bool
        options: {falseLabel: "No", trueLabel: "Sí", description: {view: Evidencia de que la persona autorizó el tratamiento o contacto conforme a la finalidad informada., edit: 'Marque Sí únicamente después de obtener una autorización previa, informada y verificable; registre también su fecha y origen cuando estén disponibles.'}}
      fechaAutorizacion: {label: Fecha de autorización, kind: DateTime, options: {description: {view: Evidencia de que la persona autorizó el tratamiento o contacto conforme a la finalidad informada., edit: 'Registre la fecha y hora en que se obtuvo la autorización verificable, usando America/Bogota. Es opcional; complételo cuando la información esté disponible.'}}}
      departamento: {label: Departamento, kind: String, options: {description: {view: El campo «Departamento» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese departamento con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      ciudad: {label: Ciudad, kind: String, options: {description: {view: El campo «Ciudad» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese ciudad con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      codigoDivipola: {label: Código DIVIPOLA, kind: String, options: {description: {view: El campo «Código DIVIPOLA» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese código divipola con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      direccion: {label: Dirección de servicio, kind: String, options: {description: {view: El campo «Dirección de servicio» conserva información operativa del registro en Clientes y prospectos., edit: 'Ingrese dirección de servicio con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
