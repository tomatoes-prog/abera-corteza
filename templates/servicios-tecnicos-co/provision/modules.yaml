          center: [4.711, -74.0721]
          zoom: 11
          description:
            view: Ubicación geográfica de Activos, utilizada por los mapas y la planeación operativa.
            edit: Busque o marque en el mapa la ubicación correspondiente a ubicación en el mapa. Verifique el punto antes de guardar. Es opcional; complételo cuando la información esté disponible.
      fotografias:
        label: Fotografías
        kind: File
        multi: true
        options: {allowDocuments: false, allowImages: true, maxSize: 0, mode: list, description: {view: Archivos asociados con fotografías en este registro de Activos., edit: Adjunte uno o varios archivos pertinentes para fotografías. No cargue credenciales ni información innecesaria. Es opcional; complételo cuando la información esté disponible.}}
      observaciones:
        label: Observaciones
        kind: String
        options: {multiLine: true, description: {view: El campo «Observaciones» conserva información operativa del registro en Activos., edit: 'Ingrese observaciones con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}
