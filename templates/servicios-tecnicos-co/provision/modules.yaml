      tipoEquipo: {label: Tipo de equipo, kind: String, required: true, options: {description: {view: El campo «Tipo de equipo» conserva información operativa del registro en Activos., edit: 'Ingrese tipo de equipo con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
      marca: {label: Marca, kind: String, options: {description: {view: El campo «Marca» conserva información operativa del registro en Activos., edit: 'Ingrese marca con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
