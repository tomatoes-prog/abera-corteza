workflows:
  preparar-solicitud-servicio:
    enabled: true
    trace: false
    runAs: automatizacion-servicios
    meta:
      name: Calcular SLA y asignar solicitud
      description: Antes de crear una solicitud, calcula el vencimiento según prioridad y asigna un coordinador con menor carga. Respeta selección manual y deja la solicitud sin responsable cuando no hay candidatos activos.
    triggers:
      - enabled: true
        stepID: 10
        resourceType: compose:record
        eventType: beforeCreate
        constraints:
          - { name: namespace.handle, op: "=", values: [servicios-tecnicos-co] }
          - { name: module.handle, op: "=", values: [solicitudes] }
    steps:
      - { id: 10, kind: gateway, ref: excl }
      - id: 11
        kind: expressions
        arguments: [{ target: record.values.vencimientoSLA, type: String, expr: 'strftime(now() + duration("PT2H"), "%Y-%m-%dT%H:%M:%S")' }]
      - id: 12
        kind: expressions
        arguments: [{ target: record.values.vencimientoSLA, type: String, expr: 'strftime(now() + duration("PT8H"), "%Y-%m-%dT%H:%M:%S")' }]
      - id: 13
        kind: expressions
        arguments: [{ target: record.values.vencimientoSLA, type: String, expr: 'strftime(now() + duration("P1D"), "%Y-%m-%dT%H:%M:%S")' }]
      - id: 14
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, value: "0" }
          - { target: bestCount, type: UnsignedInteger, value: "0" }
      - id: 20
        kind: iterator
        ref: rolesEachMember
        arguments: [{ target: lookup, type: Handle, value: coordinador-servicio }]
        results: [{ target: candidate, expr: user }]
      - id: 21
        kind: function
        ref: composeRecordsSearch
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: solicitudes }
          - { target: query, type: String, expr: 'format("responsable = %d AND estado != ''Cerrada'' AND estado != ''Perdida''", candidate.ID)' }
          - { target: limit, type: UnsignedInteger, value: "1" }
          - { target: incTotal, type: Boolean, value: true }
        results: [{ target: candidateCount, expr: total }]
      - { id: 22, kind: gateway, ref: excl }
      - id: 23
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, expr: candidate.ID }
          - { target: bestCount, type: UnsignedInteger, expr: candidateCount }
      - { id: 24, kind: continue }
      - { id: 25, kind: continue }
      - { id: 30, kind: gateway, ref: excl }
      - id: 31
        kind: expressions
        arguments: [{ target: record.values.responsable, type: String, expr: 'format("%d", bestUserID)' }]
      - { id: 32, kind: termination }
    paths:
      - { parentid: 10, childid: 11, expr: 'record.values.prioridad == "Crítica"' }
      - { parentid: 10, childid: 12, expr: 'record.values.prioridad == "Alta"' }
      - { parentid: 10, childid: 13, expr: "" }
      - { parentid: 11, childid: 14 }
      - { parentid: 12, childid: 14 }
      - { parentid: 13, childid: 14 }
      - { parentid: 14, childid: 20, expr: isEmpty(record.values.responsable) }
      - { parentid: 14, childid: 32, expr: "" }
      - { parentid: 20, childid: 21 }
      - { parentid: 20, childid: 30 }
      - { parentid: 21, childid: 22 }
      - { parentid: 22, childid: 23, expr: bestUserID == 0 || candidateCount < bestCount || (candidateCount == bestCount && candidate.ID < bestUserID) }
      - { parentid: 22, childid: 25, expr: "" }
      - { parentid: 23, childid: 24 }
      - { parentid: 30, childid: 31, expr: bestUserID > 0 }
      - { parentid: 30, childid: 32, expr: "" }
      - { parentid: 31, childid: 32 }

  crear-orden-desde-cotizacion:
    enabled: true
    trace: false
    meta:
      name: Crear orden al aceptar cotización
      description: Después de aceptar una cotización, crea una orden relacionada con solicitud, cliente y activo. Solo actúa en la primera transición a Aceptada y reporta errores al consultar o crear registros.
    triggers:
      - enabled: true
        stepID: 100
        resourceType: compose:record
        eventType: afterUpdate
        constraints:
          - { name: namespace.handle, op: "=", values: [servicios-tecnicos-co] }
          - { name: module.handle, op: "=", values: [cotizaciones] }
    steps:
      - { id: 100, kind: gateway, ref: excl }
      - id: 101
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: solicitudes }
          - { target: record, type: ID, expr: record.values.solicitud }
        results: [{ target: sourceRequest, expr: record }]
      - id: 102
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: ordenes-trabajo }
        results: [{ target: workOrder, expr: record }]
      - id: 103
        kind: expressions
        arguments:
          - { target: workOrder.values.codigo, type: String, expr: 'format("OT-%s", record.ID)' }
          - { target: workOrder.values.solicitud, type: String, expr: record.values.solicitud }
          - { target: workOrder.values.cotizacion, type: String, expr: 'format("%d", record.ID)' }
          - { target: workOrder.values.cliente, type: String, expr: record.values.cliente }
          - { target: workOrder.values.activo, type: String, expr: sourceRequest.values.activo }
          - { target: workOrder.values.inicio, type: String, expr: 'strftime(now() + duration("P1D"), "%Y-%m-%dT09:00:00")' }
          - { target: workOrder.values.fin, type: String, expr: 'strftime(now() + duration("P1D"), "%Y-%m-%dT11:00:00")' }
          - { target: workOrder.values.estado, type: String, value: Programada }
      - id: 104
        kind: function
        ref: composeRecordsCreate
        arguments: [{ target: record, type: ComposeRecord, expr: workOrder }]
      - { id: 105, kind: termination }
    paths:
      - { parentid: 100, childid: 101, expr: 'record.values.estado == "Aceptada" && oldRecord.values.estado != "Aceptada"' }
      - { parentid: 100, childid: 105, expr: "" }
      - { parentid: 101, childid: 102 }
      - { parentid: 102, childid: 103 }
      - { parentid: 103, childid: 104 }
      - { parentid: 104, childid: 105 }

  asignar-tecnico-menor-carga:
    enabled: true
    trace: false
    runAs: automatizacion-servicios
    meta:
      name: Asignar técnico por menor carga
      description: Antes de crear una orden sin técnico, selecciona al técnico activo con menor número de órdenes abiertas. Conserva asignaciones manuales y permite continuar sin técnico si no hay candidatos.
    triggers:
      - enabled: true
        stepID: 200
        resourceType: compose:record
        eventType: beforeCreate
        constraints:
          - { name: namespace.handle, op: "=", values: [servicios-tecnicos-co] }
          - { name: module.handle, op: "=", values: [ordenes-trabajo] }
    steps:
      - { id: 200, kind: gateway, ref: excl }
      - id: 201
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, value: "0" }
          - { target: bestCount, type: UnsignedInteger, value: "0" }
      - id: 202
        kind: iterator
        ref: rolesEachMember
        arguments: [{ target: lookup, type: Handle, value: tecnico-servicio }]
        results: [{ target: candidate, expr: user }]
      - id: 203
        kind: function
        ref: composeRecordsSearch
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: ordenes-trabajo }
          - { target: query, type: String, expr: 'format("tecnico = %d AND estado != ''Completada'' AND estado != ''Cancelada''", candidate.ID)' }
          - { target: limit, type: UnsignedInteger, value: "1" }
          - { target: incTotal, type: Boolean, value: true }
        results: [{ target: candidateCount, expr: total }]
      - { id: 204, kind: gateway, ref: excl }
      - id: 205
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, expr: candidate.ID }
          - { target: bestCount, type: UnsignedInteger, expr: candidateCount }
      - { id: 206, kind: continue }
      - { id: 207, kind: continue }
      - { id: 208, kind: gateway, ref: excl }
      - id: 209
        kind: expressions
        arguments: [{ target: record.values.tecnico, type: String, expr: 'format("%d", bestUserID)' }]
      - { id: 210, kind: termination }
    paths:
      - { parentid: 200, childid: 201, expr: isEmpty(record.values.tecnico) }
      - { parentid: 200, childid: 210, expr: "" }
      - { parentid: 201, childid: 202 }
      - { parentid: 202, childid: 203 }
      - { parentid: 202, childid: 208 }
      - { parentid: 203, childid: 204 }
      - { parentid: 204, childid: 205, expr: bestUserID == 0 || candidateCount < bestCount || (candidateCount == bestCount && candidate.ID < bestUserID) }
      - { parentid: 204, childid: 207, expr: "" }
      - { parentid: 205, childid: 206 }
      - { parentid: 208, childid: 209, expr: bestUserID > 0 }
      - { parentid: 208, childid: 210, expr: "" }
      - { parentid: 209, childid: 210 }

  validar-agenda-tecnico:
    enabled: true
    trace: false
    meta:
      name: Validar agenda del técnico
      description: Antes de guardar una orden programada, busca cruces de horario para el mismo técnico. Detiene la operación con un error comprensible cuando existe una reserva superpuesta.
    triggers:
      - enabled: true
        stepID: 300
        resourceType: compose:record
        eventType: beforeCreate
        constraints:
          - { name: namespace.handle, op: "=", values: [servicios-tecnicos-co] }
          - { name: module.handle, op: "=", values: [ordenes-trabajo] }
    steps:
      - id: 300
        kind: function
        ref: composeRecordsSearch
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: ordenes-trabajo }
          - { target: query, type: String, expr: 'format("tecnico = %s AND inicio < ''%s'' AND fin > ''%s'' AND estado != ''Cancelada''", record.values.tecnico, record.values.fin, record.values.inicio)' }
          - { target: limit, type: UnsignedInteger, value: "1" }
          - { target: incTotal, type: Boolean, value: true }
        results: [{ target: overlaps, expr: total }]
      - { id: 301, kind: gateway, ref: excl }
      - id: 302
        kind: error
        arguments: [{ target: message, type: String, value: El técnico ya tiene una orden en ese horario. }]
      - { id: 303, kind: termination }
    paths:
      - { parentid: 300, childid: 301 }
      - { parentid: 301, childid: 302, expr: overlaps > 0 }
      - { parentid: 301, childid: 303, expr: "" }

  completar-orden-servicio:
    enabled: true
    trace: false
    meta:
      name: Actualizar activo al completar trabajo
      description: Después de completar una orden, actualiza la última intervención y el próximo mantenimiento del activo relacionado. Termina sin cambios en otros estados y reporta relaciones inválidas.
    triggers:
      - enabled: true
        stepID: 400
        resourceType: compose:record
        eventType: afterUpdate
        constraints:
          - { name: namespace.handle, op: "=", values: [servicios-tecnicos-co] }
          - { name: module.handle, op: "=", values: [ordenes-trabajo] }
    steps:
      - { id: 400, kind: gateway, ref: excl }
      - id: 401
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: servicios-tecnicos-co }
          - { target: module, type: Handle, value: activos }
          - { target: record, type: ID, expr: record.values.activo }
        results: [{ target: servicedAsset, expr: record }]
      - id: 402
        kind: expressions
        arguments:
          - { target: servicedAsset.values.estado, type: String, value: Operativo }
          - { target: servicedAsset.values.proximoMantenimiento, type: String, expr: record.values.proximoMantenimiento }
      - id: 403
        kind: function
        ref: composeRecordsUpdate
        arguments: [{ target: record, type: ComposeRecord, expr: servicedAsset }]
      - { id: 404, kind: termination }
    paths:
      - { parentid: 400, childid: 401, expr: 'record.values.estado == "Completada" && oldRecord.values.estado != "Completada" && !isEmpty(record.values.activo)' }
      - { parentid: 400, childid: 404, expr: "" }
      - { parentid: 401, childid: 402 }
      - { parentid: 402, childid: 403 }
      - { parentid: 403, childid: 404 }
