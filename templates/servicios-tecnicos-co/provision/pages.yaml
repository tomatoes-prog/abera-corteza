    visible: true
    blocks:
    - title: Agenda de técnicos
      kind: Calendar
      xywh:
      - 0
      - 0
      - 8
      - 18
      options:
        defaultView: timeGridWeek
        locale: es
        feeds:
        - resource: compose:record
          startField: inicio
          endField: fin
          titleField: codigo
          allDay: false
          options:
            module: ordenes-trabajo
            color: '#0d9488'
            prefilter: ''
      blockID: 1
    - title: Carga por técnico
      kind: Chart
      xywh:
      - 8
