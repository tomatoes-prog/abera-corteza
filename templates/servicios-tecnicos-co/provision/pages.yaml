namespace: servicios-tecnicos-co
pages:
  inicio:
    title: Centro de operaciones
    visible: true
    blocks:
      - title: Funnel de servicios
        kind: Chart
        xywh:
          - 0
          - 18
          - 24
          - 30
        options:
          chart: funnel-servicios
        blockID: 1
        description: Gráfico que resume funnel de servicios a partir de datos actuales.
      - title: Prioridades abiertas
        kind: Chart
        xywh:
          - 24
          - 18
          - 24
          - 30
        options:
          chart: solicitudes-por-prioridad
        blockID: 2
        description: Gráfico que resume prioridades abiertas a partir de datos actuales.
      - title: Órdenes por estado
        kind: Chart
        xywh:
          - 0
          - 48
          - 48
          - 30
        options:
          chart: ordenes-por-estado
        blockID: 3
        description: Gráfico que resume órdenes por estado a partir de datos actuales.
      - title: Solicitudes próximas al SLA
        kind: RecordList
        xywh:
          - 0
          - 78
          - 24
          - 48
        options:
          module: solicitudes
          fields:
            - name: codigo
            - name: cliente
            - name: prioridad
            - name: estado
            - name: responsable
            - name: vencimientoSLA
          prefilter: estado != 'Cerrada' AND estado != 'Perdida'
          presort: vencimientoSLA ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 4
        description: Listado operativo de solicitudes próximas al sla con búsqueda, filtros, conteo y exportación.
      - title: Mantenimientos próximos
        kind: RecordList
        xywh:
          - 24
          - 78
          - 24
          - 48
        options:
          module: activos
          fields:
            - name: codigo
            - name: cliente
            - name: tipoEquipo
            - name: estado
            - name: proximoMantenimiento
          prefilter: estado != 'Retirado' AND proximoMantenimiento IS NOT NULL
          presort: proximoMantenimiento ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 5
        description: Listado operativo de mantenimientos próximos con búsqueda, filtros, conteo y exportación.
      - blockID: 6
        description: Solicitudes que todavía requieren gestión operativa.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado != 'Cerrada' AND estado != 'Perdida'
              label: Solicitudes abiertas
              metricField: count
              module: solicitudes
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Solicitudes abiertas
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 7
        description: Solicitudes vencidas o próximas a incumplir su SLA.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: slaIncumplido = '1' OR vencimientoSLA < NOW()
              label: SLA en riesgo
              metricField: count
              module: solicitudes
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: SLA en riesgo
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 8
        description: Órdenes de trabajo pendientes de completar.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado != 'Completada' AND estado != 'Cancelada'
              label: Órdenes abiertas
              metricField: count
              module: ordenes-trabajo
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Órdenes abiertas
        xywh:
          - 24
          - 0
          - 12
          - 18
      - blockID: 9
        description: Valor total de las cotizaciones aceptadas en COP.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Aceptada'
              label: Valor vendido
              metricField: total
              module: cotizaciones
              numberFormat: 0,0
              operation: sum
              prefix: '$ '
              suffix: ""
          showRefresh: true
        title: Valor vendido
        xywh:
          - 36
          - 0
          - 12
          - 18
