namespace: servicios-tecnicos-co
pages:
  inicio:
    title: Centro de operaciones
    visible: true
    blocks:
    - title: Funnel de servicios
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: funnel-servicios
      blockID: 1
    - title: Prioridades abiertas
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: solicitudes-por-prioridad
      blockID: 2
    - title: Órdenes por estado
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: ordenes-por-estado
      blockID: 3
    - title: Solicitudes próximas al SLA
      kind: RecordList
      xywh:
      - 0
      - 30
      - 24
      - 18
      options:
        module: solicitudes
        fields:
        - name: codigo
        - name: cliente
        - name: prioridad
        - name: estado
        - name: responsable
        - name: vencimientoSLA
        prefilter: estado != 'Cerrada' AND estado != 'Perdida'
        presort: vencimientoSLA ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 4
    - title: Mantenimientos próximos
      kind: RecordList
      xywh:
      - 24
      - 30
      - 24
      - 18
      options:
        module: activos
        fields:
        - name: codigo
        - name: cliente
        - name: tipoEquipo
        - name: estado
        - name: proximoMantenimiento
        prefilter: estado != 'Retirado' AND proximoMantenimiento IS NOT NULL
        presort: proximoMantenimiento ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 5
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Centro de operaciones
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 24
          - 18
        - blockID: 5
          xywh:
          - 24
          - 30
          - 24
          - 18
  clientes-prospectos:
    title: Clientes
    visible: true
    blocks:
    - title: Clientes y prospectos
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: clientes-prospectos
        fields:
        - name: tipo
        - name: nombre
        - name: contacto
        - name: telefono
        - name: ciudad
        - name: segmento
        - name: estadoComercial
        - name: responsable
        - name: proximoContacto
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      cliente-registro:
        title: Detalle del cliente
        module: clientes-prospectos
        visible: false
        blocks:
        - title: Cliente o prospecto
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: tipo
            - name: tipoPersona
            - name: nombre
            - name: identificacion
            - name: contacto
            - name: telefono
            - name: correo
            - name: autorizaTratamientoDatos
            - name: departamento
            - name: ciudad
            - name: direccion
            - name: segmento
            - name: estadoComercial
            - name: responsable
            - name: proximoContacto
            - name: notas
          blockID: 1
        - title: Activos
          kind: RecordList
          xywh:
          - 0
          - 14
          - 6
          - 9
          options:
            module: activos
            fields:
            - name: codigo
            - name: tipoEquipo
            - name: marca
            - name: modelo
            - name: estado
            - name: proximoMantenimiento
            prefilter: cliente = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 2
        - title: Solicitudes
          kind: RecordList
          xywh:
          - 6
          - 14
          - 6
          - 9
          options:
            module: solicitudes
            fields:
            - name: codigo
            - name: tipoServicio
            - name: prioridad
            - name: estado
            - name: vencimientoSLA
            prefilter: cliente = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del cliente
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
            - blockID: 2
              xywh:
              - 0
              - 14
              - 6
              - 9
            - blockID: 3
              xywh:
              - 6
              - 14
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Clientes
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
