          module: leads
          queryFields:
            - nombres
            - apellidos
            - telefono
          selectType: default
      asesor:
        label: Asesor
        kind: User
        required: true
        options:
          selectType: default
      inmuebles:
        label: Inmuebles
        kind: Record
        multi: true
        options:
          labelField: nombre
          module: inmuebles
          queryFields:
            - codigo
            - nombre
            - ciudad
          selectType: multiple
      inicio:
        label: Inicio
        kind: DateTime
        required: true
      fin:
        label: Finalización
        kind: DateTime
      tipo:
        label: Tipo
        kind: Select
        required: true
        options:
          options:
            - { text: Visita, value: Visita }
            - { text: Llamada, value: Llamada }
            - { text: Virtual, value: Virtual }
            - { text: Oficina, value: Oficina }
          selectType: default
      estado:
        label: Estado
        kind: Select
        required: true
        default: Pendiente
        options:
          options:
            - { text: Pendiente, value: Pendiente }
            - { text: Confirmada, value: Confirmada }
            - { text: Completada, value: Completada }
            - { text: Cancelada, value: Cancelada }
            - { text: Reprogramada, value: Reprogramada }
            - { text: No asistió, value: No asistió }
          selectType: default
      puntoEncuentro:
        label: Punto de encuentro
        kind: String
      resultado:
        label: Resultado
        kind: String
        options:
          multiLine: true
      observaciones:
        label: Observaciones
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true

  actividades:
    name: Actividades
    fields:
      lead:
        label: Lead
        kind: Record
        required: true
        options:
          labelField: nombres
          module: leads
          queryFields:
            - nombres
            - apellidos
            - telefono
          selectType: default
      inmueble:
        label: Inmueble
        kind: Record
        options:
          labelField: nombre
          module: inmuebles
          queryFields:
            - codigo
            - nombre
            - ciudad
          selectType: default
      asesor:
        label: Asesor
        kind: User
        required: true
        options:
          selectType: default
      tipo:
        label: Tipo
        kind: Select
        required: true
        options:
          options:
            - { text: Llamada, value: Llamada }
            - { text: WhatsApp, value: WhatsApp }
            - { text: Correo, value: Correo }
            - { text: Nota, value: Nota }
            - { text: Seguimiento, value: Seguimiento }
          selectType: default
      fecha:
        label: Fecha
        kind: DateTime
        required: true
      resultado:
        label: Resultado
        kind: String
      proximaAccion:
        label: Próxima acción
        kind: DateTime
      observaciones:
        label: Observaciones
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true

  negociaciones:
    name: Negociaciones
    fields:
      lead:
        label: Lead
        kind: Record
        required: true
        options:
          labelField: nombres
          module: leads
          queryFields:
            - nombres
            - apellidos
            - telefono
          selectType: default
      inmueble:
        label: Inmueble
        kind: Record
        required: true
        options:
          labelField: nombre
          module: inmuebles
          queryFields:
            - codigo
            - nombre
            - ciudad
          selectType: default
      asesor:
        label: Asesor
        kind: User
        required: true
        options:
          selectType: default
      tipoOperacion:
        label: Tipo de operación
        kind: Select
        required: true
        options:
          options:
            - { text: Venta, value: Venta }
            - { text: Arriendo, value: Arriendo }
          selectType: default
      etapa:
        label: Etapa
        kind: Select
        required: true
        default: Calificación
        options:
          options:
            - { text: Calificación, value: Calificación }
            - { text: Oferta, value: Oferta }
            - { text: Documentación, value: Documentación }
            - { text: Cierre, value: Cierre }
          selectType: default
      valorPublicado:
        label: Valor publicado
        kind: Number
        options:
          format: "0"
          precision: 0
