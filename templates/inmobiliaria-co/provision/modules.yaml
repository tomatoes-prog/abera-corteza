        label: Dirección
        kind: String
        options:
          description:
            view: El campo «Dirección» conserva información operativa del registro en Inmuebles.
            edit: Ingrese dirección con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      codigoDivipola:
        label: Código DIVIPOLA
        kind: String
        options:
          description:
            view: El campo «Código DIVIPOLA» conserva información operativa del registro en Inmuebles.
            edit: Ingrese código divipola con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
