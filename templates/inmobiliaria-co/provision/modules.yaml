            - {text: Ascensor, value: Ascensor}
            - {text: Portería, value: Portería}
            - {text: Depósito, value: Depósito}
            - {text: Terraza, value: Terraza}
            - {text: Zona verde, value: Zona verde}
            - {text: Amoblado, value: Amoblado}
