        kind: Number
        options:
          format: "0"
          precision: 0
          prefix: "$ "
      probabilidad:
        label: Probabilidad
        kind: Number
        options:
          format: "0"
          precision: 0
          suffix: "%"
      fechaEstimadaCierre:
