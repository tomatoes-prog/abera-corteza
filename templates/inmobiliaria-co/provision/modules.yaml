        kind: String
        required: true
        options:
          description:
            view: El campo «Código» conserva información operativa del registro en Inmuebles.
            edit: Ingrese código con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      nombre:
        label: Nombre
        kind: String
        required: true
        options:
          description:
            view: El campo «Nombre» conserva información operativa del registro en Inmuebles.
            edit: Ingrese nombre con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
      descripcion:
        label: Descripción
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true
          description:
            view: El campo «Descripción» conserva información operativa del registro en Inmuebles.
            edit: Ingrese descripción con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.
      tipoOperacion:
        label: Tipo de operación
        kind: Select
        required: true
        options:
          options: &tipos-operacion
            - {text: Venta, value: Venta}
            - {text: Arriendo, value: Arriendo}
            - {text: Venta o arriendo, value: Venta o arriendo}
          selectType: default
          description:
            view: Clasificación de tipo de operación para este registro de Inmuebles.
            edit: 'Seleccione un valor para tipo de operación entre: Venta, Arriendo, Venta o arriendo. Es obligatorio para guardar un registro completo.'
