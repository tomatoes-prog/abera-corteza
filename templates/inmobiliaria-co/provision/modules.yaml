            view: Clasificación de departamento para este registro de Inmuebles.
            edit: Seleccione un valor para departamento. Es obligatorio para guardar un registro completo.
      ciudad:
        label: Ciudad
        kind: String
        required: true
        options:
          description:
            view: El campo «Ciudad» conserva información operativa del registro en Inmuebles.
            edit: Ingrese ciudad con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.
