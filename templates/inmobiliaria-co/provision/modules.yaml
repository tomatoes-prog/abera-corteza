            view: Archivos asociados con fotografías en este registro de Inmuebles.
            edit: Adjunte uno o varios archivos pertinentes para fotografías. No cargue credenciales ni información innecesaria. Es opcional; complételo cuando la información esté disponible.
      documentos:
