        label: Ubicación en el mapa
        kind: Geometry
        options:
          center: [4.711, -74.0721]
          zoom: 12
          hideGeoSearch: false
          description:
            view: Ubicación geográfica de Inmuebles, utilizada por los mapas y la planeación operativa.
            edit: Busque o marque en el mapa la ubicación correspondiente a ubicación en el mapa. Verifique el punto antes de guardar. Es opcional; complételo cuando la información esté disponible.
      disponibleDesde:
        label: Disponible desde
        kind: DateTime
        options:
          onlyDate: true
          description:
            view: Fecha de disponible desde para este registro de Inmuebles.
            edit: Indique disponible desde en formato de fecha; no agregue una hora. Es opcional; complételo cuando la información esté disponible.
      destacado:
        label: Inmueble destacado
        kind: Bool
        options:
          falseLabel: "No"
          trueLabel: "Sí"
          description:
            view: Indica si inmueble destacado aplica a este registro de Inmuebles.
            edit: Marque Sí únicamente cuando inmueble destacado esté confirmado; en caso contrario seleccione No. Es opcional; complételo cuando la información esté disponible.
      caracteristicas:
