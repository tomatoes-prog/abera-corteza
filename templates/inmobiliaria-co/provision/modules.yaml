            edit: Ingrese el número de contacto en formato internacional, preferiblemente +57 seguido de diez dígitos para Colombia. Es opcional; complételo cuando la información esté disponible.
    meta:
      description: Inventario comercial de inmuebles disponibles para venta o arriendo. Se crea un registro por inmueble y se relaciona con los leads interesados, sus visitas, actividades y negociaciones.
