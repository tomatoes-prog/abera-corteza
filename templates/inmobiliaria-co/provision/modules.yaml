          onlyDate: true
      estado:
        label: Estado
        kind: Select
        required: true
        default: Abierta
        options:
          options:
            - { text: Abierta, value: Abierta }
            - { text: Ganada, value: Ganada }
            - { text: Perdida, value: Perdida }
          selectType: default
      motivoPerdida:
        label: Motivo de pérdida
        kind: String
      observaciones:
        label: Observaciones
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true
