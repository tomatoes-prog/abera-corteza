        kind: Select
        options:
          options:
            - {text: "1", value: "1"}
            - {text: "2", value: "2"}
            - {text: "3", value: "3"}
            - {text: "4", value: "4"}
            - {text: "5", value: "5"}
            - {text: "6", value: "6"}
            - {text: Rural o no aplica, value: Rural o no aplica}
