        kind: Number
        options:
          format: "0"
          precision: 0
          prefix: "$ "
          description:
            view: Precio de venta expresado en pesos colombianos (COP) para este registro de Inmuebles.
            edit: Ingrese precio de venta en COP, sin símbolos ni separadores manuales. Es opcional; complételo cuando la información esté disponible.
      canonArrendamiento:
