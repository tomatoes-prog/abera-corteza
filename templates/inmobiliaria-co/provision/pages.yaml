namespace: inmobiliaria-co
pages:
  inicio:
    title: Inicio
    visible: true
    blocks:
    - title: Leads por estado
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: leads-por-estado
      blockID: 1
    - title: Inmuebles por estado
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: inmuebles-por-estado
      blockID: 2
    - title: Negociaciones por etapa
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: negociaciones-por-etapa
      blockID: 3
    - title: Leads sin asignar
      kind: RecordList
      xywh:
      - 0
      - 30
      - 48
      - 10
      options:
        module: leads
        fields:
        - name: nombres
        - name: apellidos
        - name: telefono
        - name: ciudadBusqueda
        - name: estado
        - name: createdAt
        prefilter: responsable IS NULL
        presort: createdAt ASC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 4
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Inicio
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 48
          - 10
  leads:
    title: Leads
    visible: true
    blocks:
    - title: Leads
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: leads
        fields:
        - name: nombres
        - name: apellidos
        - name: telefono
        - name: ciudadBusqueda
        - name: presupuestoMaximo
        - name: estado
        - name: responsable
        - name: proximoContacto
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      lead-registro:
        title: Detalle del lead
        module: leads
        visible: false
        blocks:
        - title: Información de contacto
          kind: Record
          xywh:
          - 0
          - 0
          - 4
          - 14
          options:
            fields:
            - name: nombres
            - name: apellidos
            - name: telefono
            - name: correo
            - name: autorizaTratamientoDatos
            - name: estado
            - name: responsable
            - name: fechaAsignacion
            - name: proximoContacto
          blockID: 1
        - title: Búsqueda e inmuebles de interés
          kind: Record
          xywh:
          - 4
          - 0
          - 8
          - 14
          options:
            fields:
            - name: tipoOperacion
            - name: tiposInmueble
            - name: departamentoBusqueda
            - name: ciudadBusqueda
            - name: presupuestoMinimo
            - name: presupuestoMaximo
            - name: habitacionesMinimas
            - name: banosMinimos
            - name: inmueblesInteres
            - name: notas
          blockID: 2
        - title: Citas
          kind: RecordList
          xywh:
          - 0
          - 14
          - 12
          - 9
          options:
            module: citas
            fields:
            - name: asunto
            - name: inicio
            - name: tipo
            - name: estado
            - name: asesor
            - name: inmuebles
            prefilter: lead = ${recordID}
            presort: inicio DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        - title: Actividades
          kind: RecordList
          xywh:
          - 0
          - 23
          - 6
          - 9
          options:
            module: actividades
            fields:
            - name: fecha
            - name: tipo
            - name: resultado
            - name: asesor
            - name: proximaAccion
            prefilter: lead = ${recordID}
            presort: fecha DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 4
        - title: Negociaciones
          kind: RecordList
          xywh:
          - 6
          - 23
          - 6
          - 9
          options:
            module: negociaciones
            fields:
            - name: inmueble
            - name: etapa
            - name: valorOfrecido
            - name: probabilidad
            - name: estado
            prefilter: lead = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 5
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del lead
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 4
              - 14
            - blockID: 2
              xywh:
              - 4
              - 0
              - 8
              - 14
            - blockID: 3
              xywh:
              - 0
              - 14
              - 12
              - 9
            - blockID: 4
              xywh:
              - 0
              - 23
              - 6
              - 9
            - blockID: 5
              xywh:
              - 6
              - 23
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Leads
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  inmuebles:
    title: Inmuebles
    visible: true
    blocks:
    - title: Inventario de inmuebles
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
