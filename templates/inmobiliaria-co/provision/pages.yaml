      principal:
        primary: true
        meta:
          title: Diseño principal · Actividades
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  negociaciones:
    title: Negociaciones
    visible: true
    blocks:
    - title: Pipeline comercial
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: negociaciones
        fields:
        - name: lead
        - name: inmueble
        - name: asesor
        - name: tipoOperacion
        - name: etapa
        - name: valorOfrecido
        - name: probabilidad
        - name: fechaEstimadaCierre
        - name: estado
