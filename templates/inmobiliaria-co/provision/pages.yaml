          customFilterPresets: true
        blockID: 4
        description: Listado operativo de leads sin asignar con búsqueda, filtros, conteo y exportación.
      - blockID: 5
        description: Leads con gestión comercial abierta.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado != 'Ganado' AND estado != 'Perdido' AND estado != 'Descartado'
              label: Leads activos
              metricField: count
              module: leads
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Leads activos
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 6
        description: Leads que todavía no tienen un asesor responsable.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: responsable IS NULL
              label: Leads sin asignar
              metricField: count
              module: leads
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Leads sin asignar
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 7
        description: Citas pendientes o confirmadas para visitar inmuebles.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Pendiente' OR estado = 'Confirmada'
              label: Visitas próximas
              metricField: count
              module: citas
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Visitas próximas
        xywh:
          - 24
          - 0
          - 12
          - 18
