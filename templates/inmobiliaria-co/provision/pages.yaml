      blockID: 1
    children:
      inmueble-registro:
        title: Detalle del inmueble
        module: inmuebles
        visible: false
        blocks:
        - title: Información comercial
          kind: Record
          xywh:
          - 0
          - 0
          - 6
          - 16
          options:
            fields:
            - name: codigo
            - name: nombre
            - name: descripcion
            - name: tipoOperacion
            - name: tipoInmueble
            - name: estado
            - name: precioVenta
            - name: canonArrendamiento
            - name: administracion
            - name: fotografias
            - name: documentos
          blockID: 1
        - title: Ubicación y características
          kind: Record
          xywh:
          - 6
          - 0
          - 6
          - 16
          options:
            fields:
            - name: departamento
            - name: ciudad
            - name: direccion
            - name: area
            - name: habitaciones
            - name: banos
            - name: parqueaderos
            - name: estrato
            - name: propietarioNombre
            - name: propietarioTelefono
          blockID: 2
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del inmueble
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 6
              - 16
            - blockID: 2
              xywh:
              - 6
              - 0
              - 6
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Inmuebles
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  agenda:
    title: Agenda
    visible: true
    blocks:
    - title: Calendario de citas
      kind: Calendar
      xywh:
      - 0
      - 0
      - 8
      - 18
      options:
        defaultView: dayGridMonth
        locale: es
        feeds:
        - resource: compose:record
          startField: inicio
          endField: fin
          titleField: asunto
          allDay: false
          options:
            module: citas
            color: '#2563eb'
            prefilter: ''
      blockID: 1
    - title: Próximas citas
      kind: RecordList
      xywh:
      - 8
      - 0
      - 4
      - 18
      options:
        module: citas
        fields:
        - name: asunto
        - name: inicio
        - name: lead
        - name: asesor
        - name: estado
        presort: inicio ASC
        perPage: 20
        hideRecordCloneButton: true
      blockID: 2
    children:
      cita-registro:
        title: Detalle de la cita
        module: citas
        visible: false
        blocks:
        - title: Cita
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: asunto
            - name: lead
            - name: asesor
            - name: inmuebles
            - name: inicio
            - name: fin
            - name: tipo
            - name: estado
            - name: puntoEncuentro
            - name: resultado
            - name: observaciones
          blockID: 1
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle de la cita
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Agenda
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 8
          - 18
        - blockID: 2
          xywh:
          - 8
          - 0
          - 4
          - 18
  actividades:
    title: Actividades
    visible: true
    blocks:
    - title: Actividades comerciales
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
