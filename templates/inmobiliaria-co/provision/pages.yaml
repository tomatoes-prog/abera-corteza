          fields:
            - name: nombres
            - name: apellidos
            - name: telefono
            - name: ciudadBusqueda
            - name: estado
            - name: createdAt
          prefilter: responsable IS NULL
          presort: createdAt ASC
          perPage: 20
          allowExport: true
          hideRecordCloneButton: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
