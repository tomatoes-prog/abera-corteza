namespace: admisiones-educativas-co
pages:
  inicio:
    title: Inicio
    visible: true
    blocks:
      - title: Funnel de admisiones
        kind: Chart
        xywh:
          - 0
          - 18
          - 24
          - 30
        options:
          chart: funnel-admisiones
        blockID: 1
        description: Gráfico que resume funnel de admisiones a partir de datos actuales.
      - title: Solicitudes por estado
        kind: Chart
        xywh:
          - 24
          - 18
          - 24
          - 30
        options:
          chart: solicitudes-por-estado
        blockID: 2
        description: Gráfico que resume solicitudes por estado a partir de datos actuales.
      - title: Matrículas por programa
        kind: Chart
        xywh:
          - 0
          - 48
          - 48
          - 30
        options:
          chart: matriculas-por-programa
        blockID: 3
        description: Gráfico que resume matrículas por programa a partir de datos actuales.
      - title: Prospectos sin asignar
        kind: RecordList
        xywh:
          - 0
          - 78
          - 24
          - 48
        options:
          module: prospectos
          fields:
            - name: nombres
            - name: telefono
            - name: programasInteres
            - name: estado
            - name: createdAt
          prefilter: asesor IS NULL
          presort: createdAt ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 4
        description: Listado operativo de prospectos sin asignar con búsqueda, filtros, conteo y exportación.
      - title: Solicitudes que requieren atención
        kind: RecordList
        xywh:
          - 24
          - 78
          - 24
          - 48
        options:
          module: solicitudes
          fields:
            - name: codigo
            - name: prospecto
            - name: programa
            - name: estado
            - name: completitud
          prefilter: estado = 'Incompleta' OR estado = 'En revisión'
          presort: createdAt ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 5
        description: Listado operativo de solicitudes que requieren atención con búsqueda, filtros, conteo y exportación.
      - blockID: 6
        description: Personas que continúan en el proceso de admisión.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado != 'Matriculado' AND estado != 'No matriculado'
              label: Prospectos activos
              metricField: count
              module: prospectos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Prospectos activos
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 7
        description: Solicitudes incompletas o pendientes de revisión.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Incompleta' OR estado = 'En revisión'
              label: Solicitudes incompletas
              metricField: count
              module: solicitudes
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Solicitudes incompletas
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 8
        description: Admitidos con matrícula o documentos pendientes.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Preparada' OR estado = 'Documentos pendientes'
              label: Admitidos pendientes
              metricField: count
              module: matriculas
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Admitidos pendientes
        xywh:
          - 24
          - 0
          - 12
          - 18
      - blockID: 9
        description: Estudiantes con matrícula confirmada.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Confirmada'
              label: Matrículas confirmadas
              metricField: count
              module: matriculas
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Matrículas confirmadas
        xywh:
          - 36
          - 0
          - 12
          - 18
