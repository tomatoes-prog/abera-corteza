namespace: admisiones-educativas-co
pages:
  inicio:
    title: Inicio
    visible: true
    blocks:
    - title: Funnel de admisiones
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: funnel-admisiones
      blockID: 1
    - title: Solicitudes por estado
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: solicitudes-por-estado
      blockID: 2
    - title: Matrículas por programa
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: matriculas-por-programa
      blockID: 3
    - title: Prospectos sin asignar
      kind: RecordList
      xywh:
      - 0
      - 30
      - 24
      - 18
      options:
        module: prospectos
        fields:
        - name: nombres
        - name: telefono
        - name: programasInteres
        - name: estado
        - name: createdAt
        prefilter: asesor IS NULL
        presort: createdAt ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 4
    - title: Solicitudes que requieren atención
      kind: RecordList
      xywh:
      - 24
      - 30
      - 24
      - 18
      options:
        module: solicitudes
        fields:
        - name: codigo
        - name: prospecto
        - name: programa
        - name: estado
        - name: completitud
        prefilter: estado = 'Incompleta' OR estado = 'En revisión'
        presort: createdAt ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 5
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Inicio
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 24
          - 18
        - blockID: 5
          xywh:
          - 24
          - 30
          - 24
          - 18
  prospectos:
    title: Prospectos
    visible: true
    blocks:
    - title: Prospectos
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: prospectos
        fields:
        - name: nombres
        - name: apellidos
        - name: telefono
        - name: ciudad
        - name: programasInteres
        - name: origen
        - name: estado
        - name: asesor
        - name: proximoContacto
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      prospecto-registro:
        title: Detalle del prospecto
        module: prospectos
        visible: false
        blocks:
        - title: Perfil del prospecto
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: nombres
            - name: apellidos
            - name: documento
            - name: telefono
            - name: correo
            - name: autorizaTratamientoDatos
            - name: acudienteNombre
            - name: acudienteTelefono
            - name: ciudad
            - name: nivelInteres
            - name: modalidadPreferida
            - name: programasInteres
            - name: origen
            - name: estado
            - name: asesor
            - name: fechaAsignacion
            - name: proximoContacto
            - name: notas
          blockID: 1
        - title: Solicitudes
          kind: RecordList
          xywh:
          - 0
          - 14
          - 6
          - 9
          options:
            module: solicitudes
            fields:
            - name: codigo
            - name: programa
            - name: periodo
            - name: estado
            - name: completitud
            prefilter: prospecto = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 2
        - title: Citas
          kind: RecordList
          xywh:
          - 6
          - 14
          - 6
          - 9
          options:
            module: citas-admision
            fields:
            - name: asunto
            - name: programa
            - name: tipo
            - name: inicio
            - name: estado
            prefilter: prospecto = ${recordID}
            presort: inicio DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del prospecto
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
            - blockID: 2
              xywh:
              - 0
              - 14
              - 6
              - 9
            - blockID: 3
              xywh:
              - 6
              - 14
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Prospectos
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  programas:
    title: Programas
    visible: true
    blocks:
    - title: Oferta académica
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
