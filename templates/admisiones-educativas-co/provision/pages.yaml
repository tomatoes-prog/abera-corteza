          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: codigo
            - name: nombre
            - name: nivel
            - name: modalidad
            - name: sede
            - name: duracion
            - name: valor
            - name: periodo
            - name: cupos
            - name: metaMatriculas
            - name: estado
            - name: descripcion
          blockID: 1
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del programa
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Programas
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
  solicitudes:
    title: Solicitudes
    visible: true
    blocks:
    - title: Solicitudes por programa
      kind: Chart
      xywh:
      - 0
      - 0
      - 6
      - 30
      options:
        chart: solicitudes-por-programa
      blockID: 1
    - title: Prospectos por origen
      kind: Chart
      xywh:
      - 6
      - 0
      - 6
      - 30
      options:
        chart: prospectos-por-origen
      blockID: 2
    - title: Solicitudes de admisión
      kind: RecordList
      xywh:
      - 0
      - 30
      - 12
      - 14
      options:
        module: solicitudes
        fields:
        - name: codigo
        - name: prospecto
        - name: programa
        - name: periodo
        - name: estado
        - name: completitud
        - name: revisor
        - name: puntaje
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 3
    children:
      solicitud-registro:
        title: Detalle de la solicitud
        module: solicitudes
        visible: false
        blocks:
        - title: Solicitud de admisión
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: codigo
            - name: prospecto
            - name: programa
            - name: periodo
            - name: estado
            - name: completitud
            - name: documentos
            - name: documentosVerificados
            - name: revisor
            - name: puntaje
            - name: decision
            - name: fechaEnvio
            - name: fechaDecision
            - name: observaciones
          blockID: 1
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle de la solicitud
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Solicitudes
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 6
          - 30
        - blockID: 2
          xywh:
          - 6
          - 0
          - 6
          - 30
        - blockID: 3
          xywh:
          - 0
          - 30
          - 12
          - 14
  citas-admision:
    title: Agenda
    visible: true
    blocks:
    - title: Calendario de admisiones
      kind: Calendar
      xywh:
      - 0
      - 0
      - 8
      - 18
      options:
        defaultView: dayGridMonth
        locale: es
        feeds:
        - resource: compose:record
          startField: inicio
          endField: fin
          titleField: asunto
          allDay: false
          options:
            module: citas-admision
            color: '#7c3aed'
            prefilter: ''
      blockID: 1
    - title: Próximas citas
      kind: RecordList
      xywh:
      - 8
      - 0
      - 4
      - 18
      options:
        module: citas-admision
        fields:
        - name: inicio
        - name: prospecto
        - name: programa
        - name: tipo
        - name: asesor
        - name: estado
        presort: inicio ASC
        perPage: 20
        hideRecordCloneButton: true
      blockID: 2
    children:
      cita-registro:
        title: Detalle de la cita
        module: citas-admision
        visible: false
        blocks:
        - title: Cita de admisión
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: asunto
            - name: prospecto
            - name: asesor
            - name: programa
            - name: tipo
            - name: inicio
            - name: fin
            - name: estado
            - name: resultado
            - name: siguienteAccion
            - name: observaciones
          blockID: 1
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle de la cita
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 16
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Agenda
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 8
          - 18
        - blockID: 2
          xywh:
          - 8
          - 0
          - 4
          - 18
