  revisor-admisiones: *operacion-admisiones
  director-admisiones:
    corteza::compose:namespace/admisiones-educativas-co: [read, pages.search, modules.search, charts.search]
    corteza::compose:module/admisiones-educativas-co/*: [read, record.create, records.search]
    corteza::compose:module-field/admisiones-educativas-co/*/*: [record.value.read, record.value.update]
    corteza::compose:record/admisiones-educativas-co/*/*: [read, update, delete, revisions.search]
    corteza::compose:page/admisiones-educativas-co/*: [read]
    corteza::compose:chart/admisiones-educativas-co/*: [read]
  automatizacion-admisiones:
