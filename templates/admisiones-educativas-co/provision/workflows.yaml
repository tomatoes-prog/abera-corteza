workflows:
  asignar-prospecto-admisiones:
    enabled: true
    trace: false
    runAs: automatizacion-admisiones
    keepSessions: 20
    meta: { name: Asignar prospecto de admisiones por menor carga }
    triggers:
      - enabled: true
        stepID: 10
        resourceType: compose:record
        eventType: beforeCreate
        constraints:
          - { name: namespace.handle, op: "=", values: [admisiones-educativas-co] }
          - { name: module.handle, op: "=", values: [prospectos] }
    steps:
      - { id: 10, kind: gateway, ref: excl }
      - id: 11
        kind: expressions
        arguments:
          - { target: record.values.fechaAsignacion, type: String, expr: 'strftime(now(), "%Y-%m-%dT%H:%M:%S")' }
      - id: 12
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, value: "0" }
          - { target: bestCount, type: UnsignedInteger, value: "0" }
      - id: 20
        kind: iterator
        ref: rolesEachMember
        arguments: [{ target: lookup, type: Handle, value: asesor-admisiones }]
        results: [{ target: candidate, expr: user }]
      - id: 21
        kind: function
        ref: composeRecordsSearch
        arguments:
          - { target: namespace, type: Handle, value: admisiones-educativas-co }
          - { target: module, type: Handle, value: prospectos }
          - { target: query, type: String, expr: 'format("asesor = %d AND estado != ''Matriculado'' AND estado != ''No matriculado''", candidate.ID)' }
          - { target: limit, type: UnsignedInteger, value: "1" }
          - { target: incTotal, type: Boolean, value: true }
        results: [{ target: candidateCount, expr: total }]
      - { id: 22, kind: gateway, ref: excl }
      - id: 23
        kind: expressions
        arguments:
          - { target: bestUserID, type: ID, expr: candidate.ID }
          - { target: bestCount, type: UnsignedInteger, expr: candidateCount }
      - { id: 24, kind: continue }
      - { id: 25, kind: continue }
      - { id: 30, kind: gateway, ref: excl }
      - id: 31
        kind: expressions
        arguments:
          - { target: record.values.asesor, type: String, expr: 'format("%d", bestUserID)' }
          - { target: record.values.fechaAsignacion, type: String, expr: 'strftime(now(), "%Y-%m-%dT%H:%M:%S")' }
      - { id: 32, kind: termination }
      - { id: 33, kind: termination }
    paths:
      - { parentid: 10, childid: 12, expr: isEmpty(record.values.asesor) }
      - { parentid: 10, childid: 11, expr: "" }
      - { parentid: 11, childid: 32 }
      - { parentid: 12, childid: 20 }
      - { parentid: 20, childid: 21 }
      - { parentid: 20, childid: 30 }
      - { parentid: 21, childid: 22 }
      - { parentid: 22, childid: 23, expr: bestUserID == 0 || candidateCount < bestCount || (candidateCount == bestCount && candidate.ID < bestUserID) }
      - { parentid: 22, childid: 25, expr: "" }
      - { parentid: 23, childid: 24 }
      - { parentid: 30, childid: 31, expr: bestUserID > 0 }
      - { parentid: 30, childid: 33, expr: "" }
      - { parentid: 31, childid: 32 }

  validar-solicitud-admision:
    enabled: true
    trace: false
    meta: { name: Validar solicitud antes de enviarla }
    triggers:
      - enabled: true
        stepID: 100
        resourceType: compose:record
        eventType: beforeUpdate
        constraints:
          - { name: namespace.handle, op: "=", values: [admisiones-educativas-co] }
          - { name: module.handle, op: "=", values: [solicitudes] }
    steps:
      - { id: 100, kind: gateway, ref: excl }
      - id: 101
        kind: error
        arguments:
          - { target: message, type: String, value: La solicitud necesita prospecto, programa, periodo y documentos verificados antes de enviarse. }
      - id: 102
        kind: expressions
        arguments:
          - { target: record.values.completitud, type: Integer, value: "100" }
          - { target: record.values.fechaEnvio, type: String, expr: 'strftime(now(), "%Y-%m-%dT%H:%M:%S")' }
      - { id: 103, kind: termination }
    paths:
      - { parentid: 100, childid: 101, expr: 'record.values.estado == "Enviada" && (isEmpty(record.values.prospecto) || isEmpty(record.values.programa) || isEmpty(record.values.periodo) || record.values.documentosVerificados != true)' }
      - { parentid: 100, childid: 102, expr: 'record.values.estado == "Enviada" && oldRecord.values.estado != "Enviada"' }
      - { parentid: 100, childid: 103, expr: "" }
      - { parentid: 102, childid: 103 }

  crear-matricula-desde-admision:
    enabled: true
    trace: false
    meta: { name: Preparar matrícula al admitir }
    triggers:
      - enabled: true
        stepID: 200
        resourceType: compose:record
        eventType: afterUpdate
        constraints:
          - { name: namespace.handle, op: "=", values: [admisiones-educativas-co] }
          - { name: module.handle, op: "=", values: [solicitudes] }
    steps:
      - { id: 200, kind: gateway, ref: excl }
      - id: 201
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: admisiones-educativas-co }
          - { target: module, type: Handle, value: matriculas }
        results: [{ target: enrollment, expr: record }]
      - id: 202
        kind: expressions
        arguments:
          - { target: enrollment.values.codigo, type: String, expr: 'format("MAT-%s", record.ID)' }
          - { target: enrollment.values.solicitud, type: String, expr: 'format("%d", record.ID)' }
          - { target: enrollment.values.estudiante, type: String, expr: record.values.prospecto }
          - { target: enrollment.values.programa, type: String, expr: record.values.programa }
          - { target: enrollment.values.periodo, type: String, expr: record.values.periodo }
          - { target: enrollment.values.estado, type: String, value: Preparada }
          - { target: enrollment.values.estadoPago, type: String, value: Pendiente }
      - id: 203
        kind: function
        ref: composeRecordsCreate
        arguments: [{ target: record, type: ComposeRecord, expr: enrollment }]
      - id: 204
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: admisiones-educativas-co }
          - { target: module, type: Handle, value: prospectos }
          - { target: record, type: ID, expr: record.values.prospecto }
        results: [{ target: admittedProspect, expr: record }]
      - id: 205
        kind: expressions
        arguments: [{ target: admittedProspect.values.estado, type: String, value: Admitido }]
      - id: 206
        kind: function
        ref: composeRecordsUpdate
        arguments: [{ target: record, type: ComposeRecord, expr: admittedProspect }]
      - { id: 207, kind: termination }
    paths:
      - { parentid: 200, childid: 201, expr: 'record.values.estado == "Admitida" && oldRecord.values.estado != "Admitida"' }
      - { parentid: 200, childid: 207, expr: "" }
      - { parentid: 201, childid: 202 }
      - { parentid: 202, childid: 203 }
      - { parentid: 203, childid: 204 }
      - { parentid: 204, childid: 205 }
      - { parentid: 205, childid: 206 }
      - { parentid: 206, childid: 207 }

  confirmar-matricula:
    enabled: true
    trace: false
    meta: { name: Confirmar matrícula y convertir prospecto }
    triggers:
      - enabled: true
        stepID: 300
        resourceType: compose:record
        eventType: afterUpdate
        constraints:
          - { name: namespace.handle, op: "=", values: [admisiones-educativas-co] }
          - { name: module.handle, op: "=", values: [matriculas] }
    steps:
      - { id: 300, kind: gateway, ref: excl }
      - id: 301
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: admisiones-educativas-co }
          - { target: module, type: Handle, value: prospectos }
          - { target: record, type: ID, expr: record.values.estudiante }
        results: [{ target: enrolledProspect, expr: record }]
      - id: 302
        kind: expressions
        arguments: [{ target: enrolledProspect.values.estado, type: String, value: Matriculado }]
      - id: 303
        kind: function
        ref: composeRecordsUpdate
        arguments: [{ target: record, type: ComposeRecord, expr: enrolledProspect }]
      - { id: 304, kind: termination }
    paths:
      - { parentid: 300, childid: 301, expr: 'record.values.estado == "Confirmada" && oldRecord.values.estado != "Confirmada"' }
      - { parentid: 300, childid: 304, expr: "" }
      - { parentid: 301, childid: 302 }
      - { parentid: 302, childid: 303 }
      - { parentid: 303, childid: 304 }
