namespace: centro-contacto-co
pages:
  inicio:
    title: Panel del supervisor
    visible: true
    blocks:
      - title: Funnel comercial
        kind: Chart
        xywh:
          - 0
          - 18
          - 24
          - 30
        options:
          chart: funnel-contacto
        blockID: 1
        description: Gráfico que resume funnel comercial a partir de datos actuales.
      - title: Resultados de llamadas
        kind: Chart
        xywh:
          - 24
          - 18
          - 24
          - 30
        options:
          chart: resultados-llamadas
        blockID: 2
        description: Gráfico que resume resultados de llamadas a partir de datos actuales.
      - title: Productividad por agente
        kind: Chart
        xywh:
          - 0
          - 48
          - 48
          - 30
        options:
          chart: llamadas-por-agente
        blockID: 3
        description: Gráfico que resume productividad por agente a partir de datos actuales.
      - title: Callbacks vencidos y pendientes
        kind: RecordList
        xywh:
          - 0
          - 78
          - 24
          - 48
        options:
          module: registros-campana
          fields:
            - name: codigo
            - name: campana
            - name: contacto
            - name: agente
            - name: intentos
            - name: proximoIntento
            - name: estado
          prefilter: estado = 'Callback' OR estado = 'Pendiente'
          presort: proximoIntento ASC
          perPage: 20
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 4
        description: Listado operativo de callbacks vencidos y pendientes con búsqueda, filtros, conteo y exportación.
      - title: Oportunidades recientes
        kind: RecordList
        xywh:
          - 24
          - 78
          - 24
          - 48
        options:
          module: oportunidades
          fields:
            - name: contacto
            - name: campana
            - name: closer
            - name: producto
            - name: etapa
            - name: valor
            - name: probabilidad
          prefilter: etapa != 'Venta' AND etapa != 'Perdida'
          presort: createdAt DESC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 5
        description: Listado operativo de oportunidades recientes con búsqueda, filtros, conteo y exportación.
      - blockID: 6
        description: Contactos pendientes o con devolución de llamada programada.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Pendiente' OR estado = 'Callback'
              label: Gestiones pendientes
              metricField: count
              module: registros-campana
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Gestiones pendientes
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 7
        description: Devoluciones de llamada cuya fecha ya venció.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado = 'Callback' AND proximoIntento < NOW()
              label: Callbacks vencidos
              metricField: count
              module: registros-campana
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Callbacks vencidos
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 8
        description: Oportunidades que continúan en gestión comercial.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: etapa != 'Venta' AND etapa != 'Perdida'
              label: Oportunidades abiertas
              metricField: count
              module: oportunidades
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Oportunidades abiertas
        xywh:
          - 24
          - 0
          - 12
          - 18
      - blockID: 9
        description: Valor de las oportunidades convertidas en venta en COP.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: etapa = 'Venta'
              label: Ventas
              metricField: valor
              module: oportunidades
              numberFormat: 0,0
              operation: sum
              prefix: '$ '
              suffix: ""
          showRefresh: true
        title: Ventas
        xywh:
          - 36
          - 0
          - 12
          - 18
