namespace: centro-contacto-co
pages:
  inicio:
    title: Panel del supervisor
    visible: true
    blocks:
    - title: Funnel comercial
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: funnel-contacto
      blockID: 1
    - title: Resultados de llamadas
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: resultados-llamadas
      blockID: 2
    - title: Productividad por agente
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: llamadas-por-agente
      blockID: 3
    - title: Callbacks vencidos y pendientes
      kind: RecordList
      xywh:
      - 0
      - 30
      - 24
      - 10
      options:
        module: registros-campana
        fields:
        - name: codigo
        - name: campana
        - name: contacto
        - name: agente
        - name: intentos
        - name: proximoIntento
        - name: estado
        prefilter: estado = 'Callback' OR estado = 'Pendiente'
        presort: proximoIntento ASC
        perPage: 20
        hideRecordCloneButton: true
      blockID: 4
    - title: Oportunidades recientes
      kind: RecordList
      xywh:
      - 24
      - 30
      - 24
      - 10
      options:
        module: oportunidades
        fields:
        - name: contacto
        - name: campana
        - name: closer
        - name: producto
        - name: etapa
        - name: valor
        - name: probabilidad
        prefilter: etapa != 'Venta' AND etapa != 'Perdida'
        presort: createdAt DESC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 5
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Panel del supervisor
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 24
          - 10
        - blockID: 5
          xywh:
          - 24
          - 30
          - 24
          - 10
  contactos-leads:
    title: Contactos
    visible: true
    blocks:
    - title: Contactos y leads
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: contactos-leads
        fields:
        - name: nombres
        - name: apellidos
        - name: telefonoPrincipal
        - name: ciudad
        - name: productoInteres
        - name: presupuesto
        - name: estadoComercial
        - name: responsable
        - name: totalIntentos
        - name: proximaLlamada
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      contacto-registro:
        title: Detalle del contacto
        module: contactos-leads
        visible: false
        blocks:
        - title: Contacto
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: nombres
            - name: apellidos
            - name: identificacion
            - name: telefonoPrincipal
            - name: telefonoAlterno
            - name: correo
            - name: ciudad
            - name: autorizaTratamientoDatos
            - name: autorizaContacto
            - name: noLlamar
            - name: productoInteres
            - name: presupuesto
            - name: estadoComercial
            - name: responsable
            - name: totalIntentos
            - name: proximaLlamada
            - name: notas
          blockID: 1
        - title: Llamadas
          kind: RecordList
          xywh:
          - 0
          - 14
          - 6
          - 9
          options:
            module: llamadas
            fields:
            - name: inicio
            - name: campana
            - name: agente
            - name: duracionSegundos
            - name: disposicion
            - name: callback
            prefilter: contacto = ${recordID}
            presort: inicio DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 2
        - title: Oportunidades
          kind: RecordList
          xywh:
          - 6
          - 14
          - 6
          - 9
          options:
            module: oportunidades
            fields:
            - name: campana
            - name: producto
            - name: closer
            - name: etapa
            - name: valor
            - name: probabilidad
            prefilter: contacto = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del contacto
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
            - blockID: 2
              xywh:
              - 0
              - 14
              - 6
              - 9
            - blockID: 3
              xywh:
              - 6
              - 14
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Contactos
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 12
          - 18
