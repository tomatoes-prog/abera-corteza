      responsable: {label: Responsable, kind: User, options: {description: {view: Usuario de Corteza responsable de responsable en este registro de Contactos y leads., edit: Seleccione un usuario activo con el rol operativo correspondiente. Es opcional; complételo cuando la información esté disponible.}}}
