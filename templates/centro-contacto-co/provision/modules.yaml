      noLlamar:
        label: No llamar
        kind: Bool
        options: {falseLabel: "No", trueLabel: "Sí", description: {view: Indica si no llamar aplica a este registro de Contactos y leads., edit: Marque Sí únicamente cuando no llamar esté confirmado; en caso contrario seleccione No. Es opcional; complételo cuando la información esté disponible.}}
      motivoNoContactar: {label: Motivo para no contactar, kind: String, options: {description: {view: El campo «Motivo para no contactar» conserva información operativa del registro en Contactos y leads., edit: 'Ingrese motivo para no contactar con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
      productoInteres: {label: Producto de interés, kind: String, options: {description: {view: El campo «Producto de interés» conserva información operativa del registro en Contactos y leads., edit: 'Ingrese producto de interés con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
