      apellidos: {label: Apellidos, kind: String, options: {description: {view: El campo «Apellidos» conserva información operativa del registro en Contactos y leads., edit: 'Ingrese apellidos con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
