      proximaLlamada: {label: Próxima llamada, kind: DateTime, options: {description: {view: 'Fecha y hora de próxima llamada para este registro de Contactos y leads, interpretada en America/Bogota.', edit: Indique próxima llamada usando la zona horaria America/Bogota. Es opcional; complételo cuando la información esté disponible.}}}
