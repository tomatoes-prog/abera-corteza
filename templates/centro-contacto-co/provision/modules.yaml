        options: {falseLabel: "No", trueLabel: "Sí", description: {view: Indica si registro de números excluidos consultado aplica a este registro de Contactos y leads., edit: Marque Sí únicamente cuando registro de números excluidos consultado esté confirmado; en caso contrario seleccione No. Es opcional; complételo cuando la información esté disponible.}}
