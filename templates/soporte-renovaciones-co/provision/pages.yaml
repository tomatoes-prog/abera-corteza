namespace: soporte-renovaciones-co
pages:
  inicio:
    title: Centro de soporte y retención
    visible: true
    blocks:
      - title: Casos por prioridad
        kind: Chart
        xywh:
          - 0
          - 18
          - 24
          - 30
        options:
          chart: casos-por-prioridad
        blockID: 1
        description: Gráfico que resume casos por prioridad a partir de datos actuales.
      - title: Cumplimiento de SLA
        kind: Chart
        xywh:
          - 24
          - 18
          - 24
          - 30
        options:
          chart: cumplimiento-sla
        blockID: 2
        description: Gráfico que resume cumplimiento de sla a partir de datos actuales.
      - title: Funnel de renovaciones
        kind: Chart
        xywh:
          - 0
          - 48
          - 48
          - 30
        options:
          chart: funnel-renovaciones
        blockID: 3
        description: Gráfico que resume funnel de renovaciones a partir de datos actuales.
      - title: Casos próximos a incumplir
        kind: RecordList
        xywh:
          - 0
          - 78
          - 24
          - 48
        options:
          module: casos
          fields:
            - name: codigo
            - name: cliente
            - name: asunto
            - name: prioridad
            - name: estado
            - name: agente
            - name: vencimientoResolucion
            - name: estadoSLA
          prefilter: estado != 'Cerrado' AND estado != 'Cancelado'
          presort: vencimientoResolucion ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 4
        description: Listado operativo de casos próximos a incumplir con búsqueda, filtros, conteo y exportación.
      - title: Renovaciones en riesgo
        kind: RecordList
        xywh:
          - 24
          - 78
          - 24
          - 48
        options:
          module: renovaciones
          fields:
            - name: codigo
            - name: cliente
            - name: fechaVencimiento
            - name: etapa
            - name: nuevoValor
            - name: probabilidad
            - name: riesgo
          prefilter: riesgo = 'Alto' OR riesgo = 'Medio'
          presort: fechaVencimiento ASC
          perPage: 15
          hideRecordCloneButton: true
          allowExport: true
          showTotalCount: true
          showRecordPerPageOption: true
          inlineValueFiltering: true
          hideSearch: false
          hideFiltering: false
          hideConfigureFieldsButton: false
          customFilterPresets: true
        blockID: 5
        description: Listado operativo de renovaciones en riesgo con búsqueda, filtros, conteo y exportación.
      - blockID: 6
        description: Casos de soporte pendientes de cierre.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estado != 'Cerrado' AND estado != 'Cancelado'
              label: Backlog abierto
              metricField: count
              module: casos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Backlog abierto
        xywh:
          - 0
          - 0
          - 12
          - 18
      - blockID: 7
        description: Casos críticos que todavía requieren atención.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: prioridad = 'Crítica' AND estado != 'Cerrado'
              label: Casos críticos
              metricField: count
              module: casos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: Casos críticos
        xywh:
          - 12
          - 0
          - 12
          - 18
      - blockID: 8
        description: Casos con SLA en riesgo o ya incumplido.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: estadoSLA = 'En riesgo' OR estadoSLA = 'Incumplido'
              label: SLA en riesgo
              metricField: count
              module: casos
              numberFormat: 0,0
              operation: count
              prefix: ""
              suffix: ""
          showRefresh: true
        title: SLA en riesgo
        xywh:
          - 24
          - 0
          - 12
          - 18
      - blockID: 9
        description: Valor de renovaciones con riesgo medio o alto en COP.
        kind: Metric
        options:
          metrics:
            - drillDown:
                enabled: false
              filter: riesgo = 'Alto' OR riesgo = 'Medio'
              label: Valor en riesgo
              metricField: nuevoValor
              module: renovaciones
              numberFormat: 0,0
              operation: sum
              prefix: '$ '
              suffix: ""
          showRefresh: true
        title: Valor en riesgo
        xywh:
          - 36
          - 0
          - 12
          - 18
