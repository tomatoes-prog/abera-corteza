namespace: soporte-renovaciones-co
pages:
  inicio:
    title: Centro de soporte y retención
    visible: true
    blocks:
    - title: Casos por prioridad
      kind: Chart
      xywh:
      - 0
      - 0
      - 16
      - 30
      options:
        chart: casos-por-prioridad
      blockID: 1
    - title: Cumplimiento de SLA
      kind: Chart
      xywh:
      - 16
      - 0
      - 16
      - 30
      options:
        chart: cumplimiento-sla
      blockID: 2
    - title: Funnel de renovaciones
      kind: Chart
      xywh:
      - 32
      - 0
      - 16
      - 30
      options:
        chart: funnel-renovaciones
      blockID: 3
    - title: Casos próximos a incumplir
      kind: RecordList
      xywh:
      - 0
      - 30
      - 24
      - 18
      options:
        module: casos
        fields:
        - name: codigo
        - name: cliente
        - name: asunto
        - name: prioridad
        - name: estado
        - name: agente
        - name: vencimientoResolucion
        - name: estadoSLA
        prefilter: estado != 'Cerrado' AND estado != 'Cancelado'
        presort: vencimientoResolucion ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 4
    - title: Renovaciones en riesgo
      kind: RecordList
      xywh:
      - 24
      - 30
      - 24
      - 18
      options:
        module: renovaciones
        fields:
        - name: codigo
        - name: cliente
        - name: fechaVencimiento
        - name: etapa
        - name: nuevoValor
        - name: probabilidad
        - name: riesgo
        prefilter: riesgo = 'Alto' OR riesgo = 'Medio'
        presort: fechaVencimiento ASC
        perPage: 15
        hideRecordCloneButton: true
      blockID: 5
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Centro de soporte y retención
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
          - 0
          - 0
          - 16
          - 30
        - blockID: 2
          xywh:
          - 16
          - 0
          - 16
          - 30
        - blockID: 3
          xywh:
          - 32
          - 0
          - 16
          - 30
        - blockID: 4
          xywh:
          - 0
          - 30
          - 24
          - 18
        - blockID: 5
          xywh:
          - 24
          - 30
          - 24
          - 18
  clientes:
    title: Clientes
    visible: true
    blocks:
    - title: Clientes
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: clientes
        fields:
        - name: codigo
        - name: nombre
        - name: contactoPrincipal
        - name: correo
        - name: segmento
        - name: planActual
        - name: responsable
        - name: valorRecurrente
        - name: salud
        - name: satisfaccion
        - name: riesgo
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        hideRecordCloneButton: true
      blockID: 1
    children:
      cliente-registro:
        title: Detalle del cliente
        module: clientes
        visible: false
        blocks:
        - title: Perfil del cliente
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 14
          options:
            fields:
            - name: codigo
            - name: tipo
            - name: nombre
            - name: identificacion
            - name: contactoPrincipal
            - name: telefono
            - name: correo
            - name: autorizaTratamientoDatos
            - name: segmento
            - name: planActual
            - name: responsable
            - name: valorRecurrente
            - name: salud
            - name: satisfaccion
            - name: riesgo
            - name: notas
          blockID: 1
        - title: Casos
          kind: RecordList
          xywh:
          - 0
          - 14
          - 6
          - 9
          options:
            module: casos
            fields:
            - name: codigo
            - name: asunto
            - name: prioridad
            - name: estado
            - name: agente
            - name: estadoSLA
            prefilter: cliente = ${recordID}
            presort: createdAt DESC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 2
        - title: Renovaciones
          kind: RecordList
          xywh:
          - 6
          - 14
          - 6
          - 9
          options:
            module: renovaciones
            fields:
            - name: codigo
            - name: contrato
            - name: fechaVencimiento
            - name: etapa
            - name: nuevoValor
            - name: riesgo
            prefilter: cliente = ${recordID}
            presort: fechaVencimiento ASC
            perPage: 10
            hideRecordCloneButton: true
          blockID: 3
        page_layouts:
          principal:
            primary: true
            meta:
              title: Diseño principal · Detalle del cliente
            config:
              useTitle: true
              buttons:
                new:
                  enabled: true
                edit:
                  enabled: true
                submit:
                  enabled: true
                delete:
                  enabled: true
                clone:
                  enabled: true
                back:
                  enabled: true
            blocks:
            - blockID: 1
              xywh:
              - 0
              - 0
              - 12
              - 14
            - blockID: 2
              xywh:
              - 0
              - 14
              - 6
              - 9
            - blockID: 3
              xywh:
              - 6
              - 14
              - 6
              - 9
    page_layouts:
      principal:
        primary: true
        meta:
          title: Diseño principal · Clientes
        config:
          useTitle: true
        blocks:
        - blockID: 1
          xywh:
