      nombre: {label: Nombre o razón social, kind: String, required: true, options: {description: {view: El campo «Nombre o razón social» conserva información operativa del registro en Clientes., edit: 'Ingrese nombre o razón social con información clara, concreta y verificable; evite abreviaturas ambiguas. Es obligatorio para guardar un registro completo.'}}}
      identificacion: {label: Identificación o NIT, kind: String, options: {description: {view: El campo «Identificación o NIT» conserva información operativa del registro en Clientes., edit: 'Ingrese identificación o nit con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
