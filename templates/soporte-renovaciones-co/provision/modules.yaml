      externalID: {label: Identificador externo, kind: String, options: {description: {view: El campo «Identificador externo» conserva información operativa del registro en Clientes., edit: No editar manualmente salvo durante una integración controlada. Debe contener el identificador estable del registro en el sistema externo.}}}
      proveedorExterno: {label: Proveedor externo, kind: String, options: {description: {view: El campo «Proveedor externo» conserva información operativa del registro en Clientes., edit: 'Ingrese proveedor externo con información clara, concreta y verificable; evite abreviaturas ambiguas. Es opcional; complételo cuando la información esté disponible.'}}}
