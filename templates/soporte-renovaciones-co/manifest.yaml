id: soporte-renovaciones-co
name: CRM Soporte y Renovaciones Colombia
version: 2.0.0
minimumCortezaVersion: 2024.9.9
defaultLocale: es
license: Apache-2.0
description: Soporte productivo con colas, SLA, escalamiento, problemas conocidos, renovación y expansión.
resources:
  namespace: soporte-renovaciones-co
  roles: [agente-soporte, supervisor-soporte, gestor-renovaciones, automatizacion-soporte]
  users: [automatizacion-soporte]
  modules: [clientes, contratos, casos, interacciones, renovaciones, problemas-conocidos]
  pages: [inicio, mi-cola, clientes, contratos, casos, interacciones, problemas-conocidos, renovaciones, reportes]
  charts:
    - casos-por-prioridad
    - casos-por-estado
    - casos-por-categoria
    - cumplimiento-sla
    - funnel-renovaciones
    - valor-renovaciones
  workflows:
    - preparar-caso-soporte
    - registrar-primera-respuesta
    - preparar-renovacion-contrato
    - actualizar-estado-sla
    - marcar-renovacion-riesgo
    - confirmar-renovacion
    - avisar-asignacion-soporte-renovaciones-co
    - ejemplo-correo-responsable-soporte-renovaciones-co
    - ejemplo-slack-hito-soporte-renovaciones-co
  reports: [soporte-renovaciones-co-ejecutivo, soporte-renovaciones-co-operativo]
  scripts: [scripts/seed-demo.ps1]
